<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Urban">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" sizes="192x192" href="/icon-192.png">
<title>Urban · CCG</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;
  --border:#22222e;--border2:#2e2e3e;
  --text:#e8e8f0;--muted:#666680;
  --accent:#c8a96e;--accent2:#e8c98e;
  --hot:#ff4444;--buy:#44cc88;--review:#f0a030;--pass:#6688aa;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Bebas Neue',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
button,select,input,textarea{font-family:inherit}
/* ── SCREENS ─────────────────────────────────────────────── */
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}
/* ── LOGIN ───────────────────────────────────────────────── */
#s-login{align-items:center;justify-content:center;gap:28px;padding:32px;background:var(--bg)}
.logo-m{font-family:var(--display);font-size:64px;letter-spacing:5px;color:var(--accent);line-height:1}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:-14px}
.login-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.inp{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:15px 16px;font-size:16px;font-family:var(--mono);width:100%;outline:none}
.inp:focus{border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#0a0a0f;border:none;border-radius:6px;padding:15px;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;width:100%;cursor:pointer}
.btn-primary:active{background:var(--accent2)}
#login-err{color:var(--hot);font-size:12px;text-align:center;display:none}
/* ── HEADER ─────────────────────────────────────────────── */
.hdr{padding:14px 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;padding-top:max(14px, env(safe-area-inset-top))}
.hdr-back{height:38px;display:flex;align-items:center;justify-content:center;gap:2px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;flex-shrink:0;padding:0 14px 0 10px}
.hdr-back-arrow{font-size:20px;line-height:1}
.hdr-title{font-family:var(--display);font-size:22px;letter-spacing:1px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1}
.hdr-icon-btn{width:38px;height:38px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* ── FILTER TABS ────────────────────────────────────────── */
.filter-tabs-wrap{position:relative;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.filter-tabs-wrap::after{content:'';position:absolute;right:0;top:0;bottom:1px;width:28px;background:linear-gradient(to right, transparent, var(--bg));pointer-events:none}
.filter-tabs{display:flex;gap:7px;padding:11px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-tabs::-webkit-scrollbar{display:none}
.ftab{padding:7px 15px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.3px;border:1px solid var(--border2);color:var(--muted);background:transparent;cursor:pointer;white-space:nowrap;flex-shrink:0}
.ftab.active{background:var(--accent);color:#0a0a0f;border-color:var(--accent);font-weight:700}
/* ── DEAL LIST ───────────────────────────────────────────── */
#s-list{background:var(--bg)}
.list-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px;display:flex;flex-direction:column;gap:9px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.deal-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s, background .1s}
.deal-card:active{background:var(--bg3);transform:scale(.98)}
.deal-card-accent{position:absolute;left:0;top:0;bottom:0;width:3px}
.card-addr{font-size:15px;font-weight:600;margin-bottom:3px;line-height:1.3;color:var(--text);display:flex;align-items:center;justify-content:space-between;gap:8px}
.card-chevron{color:var(--muted);font-size:18px;font-weight:400;flex-shrink:0;opacity:.6}
.card-city{font-size:12px;color:var(--muted);margin-bottom:10px}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:3px;letter-spacing:1px;text-transform:uppercase}
.b-HOT{background:rgba(255,68,68,.18);color:var(--hot);border:1px solid rgba(255,68,68,.4)}
.b-BUY{background:rgba(68,204,136,.18);color:var(--buy);border:1px solid rgba(68,204,136,.4)}
.b-REVIEW{background:rgba(240,160,48,.18);color:var(--review);border:1px solid rgba(240,160,48,.4)}
.b-PASS{background:rgba(102,136,170,.18);color:var(--pass);border:1px solid rgba(102,136,170,.4)}
.b-HARDNO{background:rgba(204,68,102,.15);color:#cc4466;border:1px solid rgba(204,68,102,.35)}
.b-PENDING{background:rgba(100,100,120,.15);color:var(--muted);border:1px solid var(--border2)}
.card-price{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent)}
.card-score{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:600}
.card-profit{font-family:var(--mono);font-size:12px;font-weight:600}
/* ── DEAL DETAIL ─────────────────────────────────────────── */
#s-deal{background:var(--bg)}
.deal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.verdict-hdr{padding:18px 16px 4px;display:flex;align-items:center;gap:16px}
.verdict-score{font-family:var(--display);font-size:46px;letter-spacing:1px;line-height:.85}
.verdict-badge-big{font-family:var(--display);font-size:22px;letter-spacing:2px;padding:5px 16px;border-radius:5px;border-width:2px;border-style:solid}
.vb-HOT{background:rgba(255,68,68,.15);color:var(--hot);border-color:rgba(255,68,68,.5)}
.vb-BUY{background:rgba(68,204,136,.15);color:var(--buy);border-color:rgba(68,204,136,.5)}
.vb-REVIEW{background:rgba(240,160,48,.15);color:var(--review);border-color:rgba(240,160,48,.5)}
.vb-PASS{background:rgba(102,136,170,.15);color:var(--pass);border-color:rgba(102,136,170,.5)}
.vb-HARDNO{background:rgba(204,68,102,.12);color:#cc4466;border-color:rgba(204,68,102,.4)}
.vb-PENDING{background:var(--bg3);color:var(--muted);border-color:var(--border2)}
.verdict-reason{font-size:12px;color:var(--muted);line-height:1.5;padding:0 16px 14px}
/* Section card (mirrors desktop .card) */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin:0 16px 12px}
.ct{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
/* Recommendation box (mirrors desktop .rec-box) */
.rec-box{background:linear-gradient(135deg,rgba(200,169,110,.1),rgba(200,169,110,.03));border:1px solid rgba(200,169,110,.3);border-radius:8px;padding:16px;margin:0 16px 14px;position:relative}
.rec-box::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:8px 0 0 8px}
.rec-ct{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
.rec-txt{font-size:13.5px;line-height:1.65;color:var(--text)}
/* Metric grid */
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px 14px}
.metric-tile{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:13px 14px}
.metric-label{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px}
.metric-val{font-family:var(--display);font-size:24px;letter-spacing:.5px;line-height:1}
.metric-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:3px}
/* Property rows */
.prow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.plbl{font-size:12px;color:var(--muted)}
.pval{font-size:12.5px;font-weight:600;color:var(--text);text-align:right}
/* Seen-by */
.seen-row{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:12px;margin:14px 16px 10px;flex-wrap:wrap}
/* Notes */
.note-bubble{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;border-left:3px solid var(--buy);margin-bottom:8px}
.note-bubble.grant-note{border-left-color:var(--accent)}
.note-meta{font-size:10px;color:var(--muted);margin-bottom:5px;display:flex;gap:8px;align-items:center}
.note-author{font-weight:700;letter-spacing:.3px}
.note-text{font-size:13px;color:var(--text);line-height:1.55}
.note-input-wrap{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.note-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:11px 12px;font-size:14px;font-family:var(--sans);outline:none;resize:none;min-height:54px}
.note-input:focus{border-color:var(--accent)}
.note-btn{background:var(--accent);color:#0a0a0f;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
.author-switch{display:flex;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:3px;margin-bottom:14px;width:fit-content}
.auth-btn{padding:7px 18px;border-radius:6px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)}
.auth-btn.active{background:var(--bg2);color:var(--accent)}
/* Negotiation ladder — stacked full-width rows, not cramped columns */
.gap-row{margin:0 16px 14px;padding:11px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px}
.gap-top{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.gap-pill{font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;letter-spacing:.3px}
.gap-bar-wrap{margin-top:8px;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.gap-bar{height:5px;border-radius:3px;transition:width .4s}
.tier-row{margin:0 16px 8px;display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-left-width:4px;border-left-style:solid;border-radius:8px;padding:13px 15px}
.tier-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;width:62px;flex-shrink:0}
.tier-price{font-family:var(--display);font-size:21px;letter-spacing:.5px;flex:1}
.tier-profit{font-family:var(--mono);font-size:12px;font-weight:600;text-align:right}
.counter-row{margin:14px 16px;padding:13px;background:var(--bg2);border:1px solid var(--border);border-radius:8px}
.counter-lbl{font-size:11px;color:var(--muted);margin-bottom:8px}
.counter-input-line{display:flex;align-items:center;gap:6px}
.counter-inp{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:10px 12px;font-size:15px;font-weight:700;font-family:var(--mono);outline:none;width:100%}
.counter-result{margin-top:9px;font-size:13px;font-weight:700;text-align:center}
/* Scripts */
.script-tabs{display:flex;gap:6px;margin:0 16px 10px}
.stab{flex:1;padding:8px 4px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted);text-align:center}
.script-box{margin:0 16px 16px;font-size:13px;color:var(--text);line-height:1.7;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;min-height:60px}
.script-eyebrow{color:var(--muted);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;display:block;margin-bottom:6px}
.copy-btn{margin:0 16px 16px;width:calc(100% - 32px);padding:11px;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.3px}
/* Chat */
.chat-messages{display:flex;flex-direction:column;gap:10px;padding:14px 16px 0}
.chat-bubble{border-radius:14px;padding:11px 14px;max-width:88%;font-size:13.5px;line-height:1.55}
.chat-bubble.urban{background:var(--bg2);border:1px solid var(--border);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.chat-bubble.user{background:var(--accent);color:#0a0a0f;font-weight:600;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble.thinking{opacity:.5}
.chat-input-wrap{display:flex;gap:9px;padding:11px 14px;background:var(--bg);border-top:1px solid var(--border);position:sticky;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 11px)}
.chat-input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:22px;color:var(--text);padding:11px 17px;font-size:15px;font-family:var(--sans);outline:none}
.chat-send{width:44px;height:44px;background:var(--accent);color:#0a0a0f;border:none;border-radius:50%;font-size:19px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.suggested-chip{cursor:pointer;font-size:11px;padding:6px 12px;border-radius:14px;background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.3);color:var(--accent2)}
/* Tab nav (bottom) */
.tab-nav{display:flex;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.tnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 9px;cursor:pointer;color:var(--muted);font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border:none;background:none}
.tnav.active{color:var(--accent)}
.tnav-icon{font-size:21px;line-height:1}
/* Loading / Empty */
.loading{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:14px;color:var(--muted);font-size:13px;font-family:var(--mono)}
.spin{width:30px;height:30px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--muted);padding:32px;text-align:center}
.empty-icon{font-size:44px;opacity:.3}
/* Phone link */
.phone-link{display:inline-block;margin-top:10px;font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
::-webkit-scrollbar{display:none}
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ────────────────────────────────────────── -->
<div class="screen active" id="s-login">
  <div style="text-align:center">
    <div class="logo-m">URBAN</div>
    <div class="logo-sub">Coralstone Underwriter</div>
  </div>
  <div class="login-box">
    <input class="inp" id="token-inp" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">Enter</button>
    <div id="login-err">Wrong password</div>
  </div>
</div>

<!-- ── DEAL LIST SCREEN ────────────────────────────────────── -->
<div class="screen" id="s-list">
  <div class="hdr">
    <div class="hdr-title">URBAN</div>
    <div id="list-count" style="font-size:11px;color:var(--muted);font-family:var(--mono);flex-shrink:0"></div>
    <button class="hdr-icon-btn" onclick="loadDeals()">↻</button>
  </div>
  <div class="filter-tabs-wrap"><div class="filter-tabs" id="filter-tabs">
    <button class="ftab active" onclick="setFilter('ALL',this)">All</button>
    <button class="ftab" onclick="setFilter('HOT',this)">🔥 Hot</button>
    <button class="ftab" onclick="setFilter('BUY',this)">Buy</button>
    <button class="ftab" onclick="setFilter('REVIEW',this)">Review</button>
    <button class="ftab" onclick="setFilter('PASS',this)">Pass</button>
    <button class="ftab" onclick="setFilter('PENDING',this)">Pending</button>
  </div></div>
  <div class="list-body" id="deal-list">
    <div class="loading"><div class="spin"></div>Loading deals…</div>
  </div>
</div>

<!-- ── DEAL DETAIL SCREEN ──────────────────────────────────── -->
<div class="screen" id="s-deal">
  <div class="hdr">
    <button class="hdr-back" onclick="goBack()"><span class="hdr-back-arrow">‹</span>Deals</button>
    <div class="hdr-title" id="d-addr" style="font-size:16px;font-family:var(--sans);font-weight:700;letter-spacing:0">—</div>
  </div>
  <div class="tab-nav" style="border-top:none;border-bottom:1px solid var(--border)">
    <button class="tnav active" onclick="showTab('overview',this)"><div class="tnav-icon">📊</div>Overview</button>
    <button class="tnav" onclick="showTab('notes',this)"><div class="tnav-icon">📝</div>Notes</button>
    <button class="tnav" onclick="showTab('ladder',this)"><div class="tnav-icon">📋</div>Offers</button>
    <button class="tnav" onclick="showTab('chat',this)"><div class="tnav-icon">💬</div>Chat</button>
  </div>
  <div class="deal-body" id="deal-body">
    <div class="loading"><div class="spin"></div></div>
  </div>
</div>

<script>
'use strict';

const BASE = window.location.origin;
let TOKEN = localStorage.getItem('urban_token') || '';
let AUTHOR = localStorage.getItem('urban_author') || 'caleb';
let allDeals = [];
let curFilter = 'ALL';
let curDeal = null;
let curUW = null;
let chatHistory = [];

// ── UTILS ─────────────────────────────────────────────────────
const fmtK = n => (n || n === 0) ? '$' + (Math.abs(n) >= 1000 ? Math.round(n/1000) + 'K' : Math.round(n)) : '—';
const fmtM = n => n != null ? '$' + Math.round(n).toLocaleString() : '—';
const esc  = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function timeAgo(ts) {
  if (!ts) return '';
  const diff = Math.floor((Date.now() - new Date(ts))/1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  const d = new Date(ts);
  return (d.getMonth()+1)+'/'+(d.getDate());
}
function vClass(v) {
  if (!v || v === 'PENDING') return 'PENDING';
  if (v === 'HARD NO') return 'HARDNO';
  return v;
}
function accentColor(v) {
  const m = {HOT:'var(--hot)',BUY:'var(--buy)',REVIEW:'var(--review)',PASS:'var(--pass)','HARD NO':'#cc4466',PENDING:'var(--muted)'};
  return m[v] || 'var(--muted)';
}
function api(path, opts) {
  const url = BASE + path;
  const headers = Object.assign({'x-urban-token': TOKEN}, opts && opts.headers || {});
  return fetch(url, Object.assign({}, opts, { headers })).then(function(r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
}

// ── SCREENS ───────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

// ── LOGIN ─────────────────────────────────────────────────────
function doLogin() {
  const t = document.getElementById('token-inp').value.trim();
  if (!t) return;
  TOKEN = t;
  api('/api/stats').then(function() {
    localStorage.setItem('urban_token', TOKEN);
    show('s-list');
    loadDeals();
  }).catch(function() {
    document.getElementById('login-err').style.display = 'block';
  });
}

(function() {
  const p = new URLSearchParams(window.location.search);
  const urlToken = p.get('token');
  if (urlToken) {
    TOKEN = urlToken;
    document.getElementById('token-inp').value = urlToken;
  }
})();

if (TOKEN) {
  api('/api/stats').then(function() {
    localStorage.setItem('urban_token', TOKEN);
    show('s-list');
    loadDeals();
  }).catch(function() { TOKEN = ''; });
}

document.getElementById('token-inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// ── DEALS ─────────────────────────────────────────────────────
function loadDeals() {
  document.getElementById('deal-list').innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>';
  api('/api/deals').then(function(data) {
    allDeals = data.deals || data || [];
    renderList();
  }).catch(function(e) {
    document.getElementById('deal-list').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div>Could not load deals.<br><small>' + e.message + '</small></div></div>';
  });
}

function setFilter(f, btn) {
  curFilter = f;
  document.querySelectorAll('.ftab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const verdictOrder = {HOT:0,BUY:1,REVIEW:2,PASS:3,'HARD NO':4,PENDING:5};
  let filtered = allDeals.filter(function(d) {
    const v = d.underwriteStatus || 'PENDING';
    if (curFilter === 'ALL') return true;
    if (curFilter === 'PENDING') return v === 'PENDING' || !d.underwriteStatus;
    return v === curFilter;
  });
  filtered.sort(function(a,b) {
    const va = verdictOrder[a.underwriteStatus||'PENDING'] ?? 5;
    const vb = verdictOrder[b.underwriteStatus||'PENDING'] ?? 5;
    if (va !== vb) return va - vb;
    return (b.underwriteScore||0) - (a.underwriteScore||0);
  });

  document.getElementById('list-count').textContent = filtered.length;

  if (!filtered.length) {
    document.getElementById('deal-list').innerHTML = '<div class="empty"><div class="empty-icon">🔍</div><div>No deals in this filter</div></div>';
    return;
  }

  document.getElementById('deal-list').innerHTML = filtered.map(function(d) {
    const v = d.underwriteStatus || 'PENDING';
    const fi = d.financials || {};
    const _uvArv = (d.arv && d.arv.urbanARV) || 0;
    const _fiAsk = fi.askingPrice && parseFloat(fi.askingPrice) > 1000 ? parseFloat(fi.askingPrice) : 0;
    const _rawAsk = parseFloat(d.askingPrice) || 0;
    const ask = _fiAsk || (_rawAsk >= 1000 ? _rawAsk : 0);
    const profit = (fi.netProfitAtAsking != null) ? fi.netProfitAtAsking : null;
    const profitColor = profit > 0 ? 'var(--buy)' : profit < 0 ? 'var(--hot)' : 'var(--muted)';
    const uid = d.uid || (d.address + '-' + (d.dateReceived||''));
    return '<div class="deal-card" data-uid="' + esc(uid) + '">' +
      '<div class="deal-card-accent" style="background:' + accentColor(v) + '"></div>' +
      '<div class="card-addr">' + esc(d.address||'Unknown') + '<span class="card-chevron">›</span></div>' +
      '<div class="card-city">' + esc((d.city||'') + (d.state ? ', '+d.state : '')) + '</div>' +
      '<div class="card-meta">' +
        '<span class="badge b-' + vClass(v) + '">' + (v==='HARD NO'?'HARD NO':v) + '</span>' +
        (d.underwriteScore ? '<span class="card-score">' + d.underwriteScore + '/10</span>' : '') +
        (ask > 0 ? '<span class="card-price">' + fmtK(ask) + '</span>' : '') +
        (profit != null ? '<span class="card-profit" style="color:' + profitColor + '">' + (profit>0?'+':'') + fmtK(profit) + '</span>' : '') +
      '</div>' +
    '</div>';
  }).join('');
}

// Single delegated listener — handles every card, present or future, with zero
// per-card string-escaping risk. This is the fix for the "cards aren't
// clickable" bug: the old approach embedded the uid into an inline onclick="
// attribute via JSON.stringify, which wraps strings in DOUBLE quotes — those
// collided with the onclick="" attribute's own double quotes and corrupted
// the handler on every single card.
document.getElementById('deal-list').addEventListener('click', function(e) {
  const card = e.target.closest('.deal-card');
  if (!card) return;
  openDeal(card.dataset.uid);
});

// ── DEAL DETAIL ───────────────────────────────────────────────
function openDeal(uid) {
  curDeal = allDeals.find(function(d) { return (d.uid||(d.address+'-'+d.dateReceived)) === uid; });
  if (!curDeal) return;
  curUW = null;
  chatHistory = [];
  show('s-deal');
  api('/api/seen/' + encodeURIComponent(uid), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({author:AUTHOR})
  }).catch(function(){});
  renderDetail('overview');
  api('/api/underwrite/' + encodeURIComponent(uid)).then(function(uw) {
    curUW = uw;
    const activeTab = document.querySelector('.deal-body').dataset.tab || 'overview';
    renderDetail(activeTab);
  }).catch(function(){});
}

function goBack() {
  show('s-list');
  curDeal = null;
  curUW = null;
}

function showTab(tab, btn) {
  document.querySelectorAll('#s-deal .tnav').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderDetail(tab);
}

function renderDetail(tab) {
  const d = curDeal;
  if (!d) return;
  const uid = d.uid || (d.address + '-' + d.dateReceived);
  const v = d.underwriteStatus || 'PENDING';
  document.getElementById('d-addr').textContent = d.address || '—';
  document.getElementById('deal-body').dataset.tab = tab;

  if (tab === 'overview') renderOverview(d, curUW, uid);
  else if (tab === 'notes') renderNotesTab(uid);
  else if (tab === 'ladder') renderLadder(curUW);
  else if (tab === 'chat') renderChat();
}

function renderOverview(d, uw, uid) {
  const fi = (uw && uw.financials) || d.financials || {};
  const arv = (uw && uw.arv && uw.arv.urbanARV) || (d.arv && d.arv.urbanARV) || 0;
  const rehab = (uw && uw.rehab && uw.rehab.urbanEstimate) || 0;
  const _fiAsk = fi.askingPrice && parseFloat(fi.askingPrice) > 1000 ? parseFloat(fi.askingPrice) : 0;
  const _rawAsk = parseFloat(d.askingPrice) || 0;
  const ask = _fiAsk || (_rawAsk >= 1000 ? _rawAsk : 0);
  const costs = (fi.holdingCosts && fi.holdingCosts.total || 0) + (fi.sellingCosts && fi.sellingCosts.total || (arv*0.075)) +
                (fi.hardMoney && fi.hardMoney.totalInterest || 0) + (fi.hardMoney && fi.hardMoney.originationPoints || 0);
  const profit = (arv > 0 && ask > 0) ? Math.round(arv - ask - rehab - costs) : (fi.netProfitAtAsking != null ? fi.netProfitAtAsking : null);
  const mao = fi.mao || (arv ? Math.round(arv*0.7 - rehab) : 0);
  const score = d.underwriteScore || (uw && uw.score) || 0;
  const reason = (uw && uw.verdictReason) || d.verdictReason || '';
  const rec = (uw && uw.recommendation) || '';
  const v = d.underwriteStatus || 'PENDING';

  let html = '';

  html += '<div class="verdict-hdr">';
  if (score) html += '<div class="verdict-score" style="color:' + accentColor(v) + '">' + score + '<span style="font-size:18px;color:var(--muted);font-family:var(--sans)">/10</span></div>';
  html += '<span class="verdict-badge-big vb-' + vClass(v) + '">' + (v==='HARD NO'?'HARD NO':v) + '</span>';
  html += '</div>';
  if (reason) html += '<div class="verdict-reason">' + esc(reason) + '</div>';

  if (rec) {
    html += '<div class="rec-box"><div class="rec-ct">Urban\'s Take</div><div class="rec-txt">' + esc(rec) + '</div></div>';
  }

  html += '<div class="metric-grid">';
  const tiles = [
    {label:'Asking', val: ask ? fmtK(ask) : '—', sub: ask ? fmtM(ask) : '', color:'var(--text)'},
    {label:'Urban ARV', val: arv ? fmtK(arv) : '—', sub: arv ? fmtM(arv) : '', color:'var(--accent)'},
    {label:'Rehab Est.', val: rehab ? fmtK(rehab) : '—', sub:'', color:'var(--review)'},
    {label:'MAO (70% − R)', val: mao ? fmtK(mao) : '—', sub:'', color:'var(--accent2)'},
    {label:'Profit @ Ask', val: profit != null ? (profit>0?'+':'')+fmtK(profit) : '—', sub:'', color: profit>0?'var(--buy)':profit<0?'var(--hot)':'var(--muted)'},
    {label:'ROI', val: fi.roi ? fi.roi+'%' : '—', sub:'', color:'var(--text)'},
  ];
  tiles.forEach(function(t){
    html += '<div class="metric-tile"><div class="metric-label">' + t.label + '</div>' +
      '<div class="metric-val" style="color:' + t.color + '">' + t.val + '</div>' +
      (t.sub ? '<div class="metric-sub">' + t.sub + '</div>' : '') + '</div>';
  });
  html += '</div>';

  html += '<div class="card"><div class="ct">Property</div>';
  const rows = [
    ['City', (d.city||'')+(d.state?', '+d.state:'')+(d.zip?' '+d.zip:'')],
    ['County', d.county],
    ['Beds / Baths', d.beds && d.baths ? d.beds+' bd · '+d.baths+' ba' : null],
    ['Sqft', d.sqft ? parseInt(d.sqft).toLocaleString()+' sf' : null],
    ['Year Built', d.yearBuilt],
    ['Construction', d.construction],
    ['Wholesaler ARV', d.wholesalerARV ? fmtM(d.wholesalerARV) : null],
  ].filter(function(r){return r[1];});
  rows.forEach(function(r){
    html += '<div class="prow"><span class="plbl">' + esc(r[0]) + '</span><span class="pval">' + esc(String(r[1])) + '</span></div>';
  });
  html += '</div>';

  const wsName = d.contact1Company || d.wholesalerCompany || d.contact1Name || '';
  const wsPhone = d.contact1Phone || '';
  if (wsName) {
    html += '<div class="card"><div class="ct">Source</div>';
    html += '<div style="font-size:14px;font-weight:600">' + esc(wsName) + '</div>';
    if (d.contact1Name && d.contact1Company) html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(d.contact1Name) + '</div>';
    if (wsPhone) html += '<a class="phone-link" href="tel:' + esc(wsPhone) + '">📞 ' + esc(wsPhone) + '</a>';
    html += '</div>';
  }

  document.getElementById('deal-body').innerHTML = html;
}

// ── NOTES ─────────────────────────────────────────────────────
function renderNotesTab(uid) {
  document.getElementById('deal-body').innerHTML = '<div class="loading"><div class="spin"></div></div>';
  api('/api/notes/' + encodeURIComponent(uid)).then(function(data){
    buildNotesUI(data.notes||[], data.seenBy||{}, uid);
  }).catch(function(){
    buildNotesUI([], {}, uid);
  });
}

function buildNotesUI(notes, seenBy, uid) {
  let html = '';

  html += '<div class="seen-row">';
  html += '<span style="color:var(--muted)">👁 Seen by:</span>';
  if (seenBy.caleb) html += '<span><strong style="color:var(--buy)">Caleb</strong> <span style="color:var(--muted);font-size:10px">' + timeAgo(seenBy.caleb) + '</span></span>';
  if (seenBy.grant) html += '<span><strong style="color:var(--accent)">Grant</strong> <span style="color:var(--muted);font-size:10px">' + timeAgo(seenBy.grant) + '</span></span>';
  if (!seenBy.caleb && !seenBy.grant) html += '<span style="color:var(--muted)">Nobody yet</span>';
  html += '</div>';

  html += '<div style="padding:0 16px">';
  html += '<div class="author-switch">' +
    '<button class="auth-btn' + (AUTHOR==='caleb'?' active':'') + '" onclick="setAuthor(\'caleb\')">Caleb</button>' +
    '<button class="auth-btn' + (AUTHOR==='grant'?' active':'') + '" onclick="setAuthor(\'grant\')">Grant</button>' +
    '</div>';

  if (notes.length === 0) {
    html += '<div style="font-size:13px;color:var(--muted);padding:10px 0 18px;opacity:.7">No notes yet — add one below. Urban reads these in its next analysis.</div>';
  } else {
    notes.forEach(function(n){
      const isC = (n.author||'').toLowerCase()==='caleb';
      html += '<div class="note-bubble' + (isC?'':' grant-note') + '">' +
        '<div class="note-meta"><span class="note-author" style="color:' + (isC?'var(--buy)':'var(--accent)') + '">' + (isC?'CALEB':'GRANT') + '</span><span>' + timeAgo(n.created_at) + '</span></div>' +
        '<div class="note-text">' + esc(n.note) + '</div></div>';
    });
  }

  html += '<div class="note-input-wrap">' +
    '<textarea class="note-input" id="note-inp" placeholder="Add a note — Urban reads these…" data-uid="' + esc(uid) + '"></textarea>' +
    '<button class="note-btn" onclick="submitNote()">Add Note</button>' +
    '</div></div>';

  document.getElementById('deal-body').innerHTML = html;
}

function setAuthor(a) {
  AUTHOR = a;
  localStorage.setItem('urban_author', a);
  document.querySelectorAll('.auth-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelector('.auth-btn.active');
  var idx = a === 'caleb' ? 0 : 1;
  var btns = document.querySelectorAll('.auth-btn');
  if (btns[idx]) btns[idx].classList.add('active');
}

function submitNote() {
  const inp = document.getElementById('note-inp');
  if (!inp) return;
  const note = inp.value.trim();
  const uid = inp.dataset.uid;
  if (!note || !uid) return;
  inp.value = '';
  inp.disabled = true;
  api('/api/notes/' + encodeURIComponent(uid), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({note:note, author:AUTHOR})
  }).then(function(data){
    buildNotesUI(data.notes||[], data.seenBy||{}, uid);
  }).catch(function(){
    inp.disabled = false;
    inp.value = note;
  });
}

// ── NEGOTIATION LADDER ────────────────────────────────────────
function renderLadder(uw) {
  if (!uw || !uw.arv || !uw.arv.urbanARV || !uw.rehab || !uw.rehab.urbanEstimate) {
    document.getElementById('deal-body').innerHTML =
      '<div class="empty"><div class="empty-icon">⏳</div><div>Run a full underwrite first to see the negotiation ladder</div></div>';
    return;
  }
  const arv   = uw.arv.urbanARV;
  const rehab = uw.rehab.urbanEstimate;
  const fi    = uw.financials || {};
  const holdCost = fi.holdingCosts && fi.holdingCosts.total || Math.round(arv*0.04);
  const sellCost = fi.sellingCosts && fi.sellingCosts.total || Math.round(arv*0.075);
  const hmlCost  = (fi.hardMoney && ((fi.hardMoney.totalInterest||0)+(fi.hardMoney.originationPoints||0))) || Math.round(arv*0.035);
  const totalCosts = rehab + holdCost + sellCost + hmlCost;
  const mao   = Math.round(arv*0.70 - rehab);
  const open_ = Math.round(mao*0.88);
  const nudge = Math.round(mao*0.91);
  const hold  = Math.round(mao*0.94);
  const profitAt = function(p){ return Math.round(arv - p - totalCosts); };
  const _fiAsk = fi.askingPrice && parseFloat(fi.askingPrice) > 1000 ? parseFloat(fi.askingPrice) : 0;
  const _rawAsk = curDeal ? (parseFloat(curDeal.askingPrice)||0) : 0;
  const ask = _fiAsk || (_rawAsk >= 1000 ? _rawAsk : 0);

  let html = '';

  if (ask > 0) {
    const gap = ask - open_;
    const pct2 = mao > 0 ? Math.round(((ask/mao)-1)*100) : 0;
    let gapLabel, gapColor, barW;
    if (ask <= mao)        { gapLabel='Under MAO ✅'; gapColor='var(--buy)'; barW='20%'; }
    else if (pct2 <= 10)   { gapLabel=fmtK(gap)+' spread — Closeable'; gapColor='var(--accent)'; barW='40%'; }
    else if (pct2 <= 20)   { gapLabel=fmtK(gap)+' spread — Tight'; gapColor='var(--review)'; barW='65%'; }
    else                   { gapLabel=fmtK(gap)+' spread — Far apart'; gapColor='var(--hot)'; barW='90%'; }
    html += '<div class="gap-row"><div class="gap-top">' +
        '<span style="color:var(--muted)">Ask <strong style="color:var(--text)">' + fmtK(ask) + '</strong></span>' +
        '<span class="gap-pill" style="background:' + gapColor + '22;color:' + gapColor + '">' + gapLabel + '</span>' +
        '<span style="color:var(--muted)">MAO <strong style="color:var(--text)">' + fmtK(mao) + '</strong></span>' +
      '</div><div class="gap-bar-wrap"><div class="gap-bar" style="width:' + barW + ';background:' + gapColor + '"></div></div></div>';
  }

  const tiers = [
    {label:'Open',  price:open_,  profit:profitAt(open_),  color:'var(--buy)'},
    {label:'Nudge', price:nudge,  profit:profitAt(nudge),  color:'var(--accent)'},
    {label:'Hold',  price:hold,   profit:profitAt(hold),   color:'var(--review)'},
    {label:'Walk',  price:mao,    profit:profitAt(mao),    color:'var(--hot)'},
  ];
  tiers.forEach(function(t){
    const pColor = t.profit >= 0 ? 'var(--buy)' : 'var(--hot)';
    html += '<div class="tier-row" style="border-left-color:' + t.color + '">' +
      '<div class="tier-label" style="color:' + t.color + '">' + t.label + '</div>' +
      '<div class="tier-price" style="color:' + t.color + '">' + fmtM(t.price) + '</div>' +
      '<div class="tier-profit" style="color:' + pColor + '">' + (t.profit>0?'+':'') + fmtK(t.profit) + '</div>' +
    '</div>';
  });

  html += '<div class="counter-row"><div class="counter-lbl">They counter at</div>' +
    '<div class="counter-input-line"><span style="color:var(--muted)">$</span>' +
    '<input class="counter-inp" type="number" placeholder="Enter their number" oninput="evalCounterM(this.value,' + mao + ',' + nudge + ',' + hold + ',' + open_ + ')" id="m-counter-inp"></div>' +
    '<div class="counter-result" id="m-counter-res">—</div></div>';

  html += '<div class="script-tabs" id="m-script-tabs">' +
    '<button class="stab" data-s="open" onclick="setScriptTabM(\'open\')">Open</button>' +
    '<button class="stab" data-s="nudge" onclick="setScriptTabM(\'nudge\')">Nudge</button>' +
    '<button class="stab" data-s="hold" onclick="setScriptTabM(\'hold\')">Hold</button>' +
    '<button class="stab" data-s="walk" onclick="setScriptTabM(\'walk\')">Walk</button></div>';
  html += '<div class="script-box" id="m-script-box"></div>';

  document.getElementById('deal-body').innerHTML = html;

  window._mLadder = { open_, nudge, hold, mao, arv };
  setScriptTabM('open');
}

function evalCounterM(val, mao, nudge, hold, open_) {
  const num = parseFloat(val) || 0;
  const res = document.getElementById('m-counter-res');
  if (!res || num <= 0) { if(res) {res.innerHTML='—'; res.style.color='var(--muted)';} return; }
  if (num <= nudge)      { res.innerHTML='✅ Accept'; res.style.color='var(--buy)'; }
  else if (num <= hold)  { res.innerHTML='Counter at ' + fmtK(nudge); res.style.color='var(--accent)'; }
  else if (num <= mao)   { res.innerHTML='Hold at ' + fmtK(hold); res.style.color='var(--review)'; }
  else                   { res.innerHTML='🚶 Walk away'; res.style.color='var(--hot)'; }
}

function setScriptTabM(tab) {
  document.querySelectorAll('#m-script-tabs .stab').forEach(function(b){
    const on = b.dataset.s === tab;
    b.style.background = on ? 'rgba(200,169,110,.15)' : 'transparent';
    b.style.borderColor = on ? 'var(--accent)' : 'var(--border2)';
    b.style.color = on ? 'var(--accent)' : 'var(--muted)';
  });
  const L = window._mLadder || {};
  const fN = function(n){ return '$' + Math.round(n).toLocaleString(); };
  const wsName = curDeal && (curDeal.contact1Name || curDeal.wholesalerCompany || '') || '';
  const fn = wsName.split(' ')[0] || 'them';
  const scripts = {
    open: ['OPENING OFFER', '"Hey ' + fn + ' — we ran the numbers. We can do ' + fN(L.open_) + '. Based on our comps, ARV is around ' + fN(L.arv) + ' and we have a real rehab scope here. That\'s where the math puts us."'],
    nudge: ['IF THEY PUSH BACK', '"I hear you. We can stretch to ' + fN(L.nudge) + '. That\'s us moving significantly off our opening — tight for us, but if you can get there, we sign today."'],
    hold: ['STANDING FIRM', '"' + fn + ', I\'ve pushed this as far as I can go. ' + fN(L.hold) + ' is the number. The comps don\'t support going higher. At this price we make it work."'],
    walk: ['WALKING AWAY', '"' + fn + ' — doesn\'t work for us at that number. No hard feelings. Keep us in mind next time something comes through."'],
  };
  const s = scripts[tab] || scripts.open;
  document.getElementById('m-script-box').innerHTML = '<span class="script-eyebrow">' + s[0] + '</span>' + esc(s[1]);
}

// ── CHAT ──────────────────────────────────────────────────────
function renderChat() {
  let html = '<div style="display:flex;flex-direction:column;min-height:100%">' +
    '<div style="flex:1">' +
    '<div class="chat-messages" id="chat-list">';

  if (chatHistory.length === 0) {
    html += '<div class="chat-bubble urban">Ask me anything about this deal — comps, numbers, rehab scope, what-ifs.</div>';
    html += '</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:7px;padding:12px 16px 0">' +
      ['What if repairs are $45K?','Give me 3 better comps','Counter-offer script?'].map(function(q){
        return '<span class="suggested-chip" onclick="useChip(this)">' + esc(q) + '</span>';
      }).join('') + '</div>';
  } else {
    chatHistory.forEach(function(m){
      html += '<div class="chat-bubble ' + m.role + (m.thinking?' thinking':'') + '">' + esc(m.text) + '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="chat-input-wrap">' +
    '<input class="chat-input" id="chat-inp" type="text" placeholder="Message Urban…">' +
    '<button class="chat-send" onclick="sendChat()">↑</button>' +
  '</div></div>';

  document.getElementById('deal-body').innerHTML = html;
  document.getElementById('chat-inp').addEventListener('keydown', function(e){
    if (e.key === 'Enter') sendChat();
  });
}

function useChip(el) {
  document.getElementById('chat-inp').value = el.textContent;
  sendChat();
}

function sendChat() {
  const inp = document.getElementById('chat-inp');
  if (!inp) return;
  const msg = inp.value.trim();
  if (!msg || !curDeal) return;
  inp.value = '';
  const uid = curDeal.uid || (curDeal.address + '-' + curDeal.dateReceived);

  chatHistory.push({role:'user', text:msg});
  chatHistory.push({role:'urban thinking', text:'Thinking…', thinking:true});
  refreshChatUI();

  api('/api/chat/' + encodeURIComponent(uid), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message:msg, author:AUTHOR, address:curDeal.address, city:curDeal.city})
  }).then(function(data){
    chatHistory.pop();
    chatHistory.push({role:'urban', text: data.reply || data.message || JSON.stringify(data)});
    refreshChatUI();
  }).catch(function(e){
    chatHistory.pop();
    chatHistory.push({role:'urban', text:'Error: ' + e.message});
    refreshChatUI();
  });
}

function refreshChatUI() {
  const list = document.getElementById('chat-list');
  if (!list) return;
  list.innerHTML = chatHistory.map(function(m){
    return '<div class="chat-bubble ' + m.role + (m.thinking?' thinking':'') + '">' + esc(m.text) + '</div>';
  }).join('');
  list.scrollTop = list.scrollHeight;
  const chips = document.querySelector('.suggested-chip');
  if (chips) chips.closest('div').remove();
}
</script>
