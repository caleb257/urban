<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Urban">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#0a0a0f">
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="apple-touch-icon" sizes="152x152" href="/icon-152.png">
<link rel="apple-touch-icon" sizes="167x167" href="/icon-167.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" sizes="192x192" href="/icon-192.png">
<title>Urban · CCG</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0a0f;--bg2:#111118;--bg3:#18181f;
  --border:#22222e;--border2:#2e2e3e;
  --text:#e8e8f0;--muted:#666680;
  --accent:#c8a96e;--accent2:#e8c98e;
  --hot:#ff4444;--buy:#44cc88;--review:#f0a030;--pass:#6688aa;
  --mono:'DM Mono',monospace;--sans:'DM Sans',sans-serif;--display:'Bebas Neue',sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:var(--bg);color:var(--text);font-family:var(--sans)}
button,select,input,textarea{font-family:inherit}
/* ── SCREENS ─────────────────────────────────────────────── */
.screen{position:fixed;inset:0;display:none;flex-direction:column;overflow:hidden}
.screen.active{display:flex}
/* ── LOGIN ───────────────────────────────────────────────── */
#s-login{align-items:center;justify-content:center;gap:28px;padding:32px;background:var(--bg)}
.logo-m{font-family:var(--display);font-size:64px;letter-spacing:5px;color:var(--accent);line-height:1}
.logo-sub{font-size:10px;color:var(--muted);letter-spacing:3px;text-transform:uppercase;margin-top:-14px}
.login-box{width:100%;max-width:340px;display:flex;flex-direction:column;gap:14px}
.inp{background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:15px 16px;font-size:16px;font-family:var(--mono);width:100%;outline:none}
.inp:focus{border-color:var(--accent)}
.btn-primary{background:var(--accent);color:#0a0a0f;border:none;border-radius:6px;padding:15px;font-size:14px;font-weight:700;letter-spacing:1px;text-transform:uppercase;width:100%;cursor:pointer}
.btn-primary:active{background:var(--accent2)}
#login-err{color:var(--hot);font-size:12px;text-align:center;display:none}
/* ── HEADER ─────────────────────────────────────────────── */
.hdr{padding:14px 16px 12px;background:var(--bg);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:12px;position:sticky;top:0;z-index:10;padding-top:max(14px, env(safe-area-inset-top))}
.hdr-back{height:38px;display:flex;align-items:center;justify-content:center;gap:2px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);color:var(--accent);font-size:15px;font-weight:600;cursor:pointer;flex-shrink:0;padding:0 14px 0 10px}
.hdr-back-arrow{font-size:20px;line-height:1}
.hdr-title{font-family:var(--display);font-size:22px;letter-spacing:1px;flex:1;min-width:0;overflow:hidden;white-space:nowrap;text-overflow:ellipsis;line-height:1}
.hdr-icon-btn{width:38px;height:38px;background:var(--bg3);border:1px solid var(--border);border-radius:8px;color:var(--accent);font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
/* ── FILTER TABS ────────────────────────────────────────── */
.filter-tabs-wrap{position:relative;background:var(--bg);border-bottom:1px solid var(--border);flex-shrink:0}
.filter-tabs-wrap::after{content:'';position:absolute;right:0;top:0;bottom:1px;width:28px;background:linear-gradient(to right, transparent, var(--bg));pointer-events:none}
.filter-tabs{display:flex;gap:7px;padding:11px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.filter-tabs::-webkit-scrollbar{display:none}
.ftab{padding:7px 15px;border-radius:20px;font-size:12px;font-weight:600;letter-spacing:.3px;border:1px solid var(--border2);color:var(--muted);background:transparent;cursor:pointer;white-space:nowrap;flex-shrink:0}
.ftab.active{background:var(--accent);color:#0a0a0f;border-color:var(--accent);font-weight:700}
/* ── STATS STRIP (home screen) ──────────────────────────────── */
.stats-strip{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.stat-chip{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:9px 6px;text-align:center}
.stat-chip-val{font-family:var(--display);font-size:19px;color:var(--accent);letter-spacing:.3px;line-height:1.1}
.stat-chip-lbl{font-size:8.5px;color:var(--muted);letter-spacing:.4px;text-transform:uppercase;margin-top:3px;line-height:1.2}
/* ── MAP TOGGLE / SCREEN ─────────────────────────────────────── */
.map-toggle-btn{font-size:16px}
#s-map{background:var(--bg)}
#map-canvas{flex:1;width:100%;background:var(--bg2)}
.leaflet-popup-content-wrapper{background:var(--bg2);color:var(--text);border-radius:10px;border:1px solid var(--border2)}
.leaflet-popup-tip{background:var(--bg2);border:1px solid var(--border2)}
.leaflet-popup-content{margin:12px 14px;font-family:var(--sans)}
.leaflet-container a.leaflet-popup-close-button{color:var(--muted)}
.map-pin-addr{font-size:13px;font-weight:700;color:var(--text);margin-bottom:2px}
.map-pin-city{font-size:11px;color:var(--muted);margin-bottom:7px}
.map-pin-meta{display:flex;align-items:center;gap:6px;margin-bottom:9px;flex-wrap:wrap}
.map-pin-btn{display:block;width:100%;text-align:center;background:var(--accent);color:#0a0a0f;border:none;border-radius:6px;padding:8px;font-size:12px;font-weight:700;cursor:pointer}
.map-pending-note{position:absolute;bottom:calc(env(safe-area-inset-bottom,0px) + 14px);left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border2);border-radius:20px;padding:7px 16px;font-size:11px;color:var(--muted);z-index:1000;display:none;align-items:center;gap:7px}
.map-spin{width:12px;height:12px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
/* ── SUB-TAB ROW (inside Overview — ARV/Rehab/Financials/Property/Flags) ── */
.subtab-wrap{position:relative;background:var(--bg);border-bottom:1px solid var(--border)}
.subtab-wrap::after{content:'';position:absolute;right:0;top:0;bottom:1px;width:24px;background:linear-gradient(to right, transparent, var(--bg));pointer-events:none}
.subtab-row{display:flex;gap:6px;padding:10px 16px;overflow-x:auto;-webkit-overflow-scrolling:touch}
.subtab{padding:6px 13px;border-radius:16px;font-size:11.5px;font-weight:600;border:1px solid var(--border2);color:var(--muted);background:transparent;cursor:pointer;white-space:nowrap;flex-shrink:0}
.subtab.active{background:var(--accent);color:#0a0a0f;border-color:var(--accent);font-weight:700}
/* Comp cards (ARV tab) */
.comp-card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;margin-bottom:8px}
.comp-addr{font-size:12.5px;font-weight:600;margin-bottom:5px}
.comp-row{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.comp-price{font-family:var(--mono);color:var(--accent);font-weight:700;font-size:13px}
/* Rehab line items */
.rehab-line{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--border)}
.rehab-line:last-child{border-bottom:none}
.rehab-line-name{font-size:12.5px;color:var(--text);text-transform:capitalize}
.rehab-line-val{font-family:var(--mono);font-size:12.5px;color:var(--text);font-weight:600}
.rehab-total{display:flex;justify-content:space-between;padding-top:10px;margin-top:4px;border-top:2px solid var(--border2)}
/* Risk flags */
.flag-card{border-radius:8px;padding:11px 13px;margin-bottom:8px;border-left-width:3px;border-left-style:solid}
.flag-HIGH{background:rgba(255,68,68,.08);border-left-color:var(--hot)}
.flag-MEDIUM{background:rgba(240,160,48,.07);border-left-color:var(--review)}
.flag-LOW{background:rgba(102,136,170,.06);border-left-color:var(--pass)}
.flag-title{font-size:12.5px;font-weight:700;margin-bottom:3px;display:flex;align-items:center;gap:7px}
.flag-sev{font-size:8.5px;font-weight:700;padding:2px 7px;border-radius:3px;letter-spacing:.5px}
.flag-detail{font-size:12px;color:var(--muted);line-height:1.55}
/* ── SEARCH + SORT ───────────────────────────────────────── */
.search-sort-row{display:flex;gap:8px;padding:11px 16px;background:var(--bg);border-bottom:1px solid var(--border)}
.search-wrap{flex:1;position:relative;display:flex;align-items:center}
.search-input{width:100%;background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:9px 32px 9px 12px;font-size:14px;font-family:var(--sans);outline:none}
.search-input:focus{border-color:var(--accent)}
.search-clear{position:absolute;right:6px;width:22px;height:22px;display:none;align-items:center;justify-content:center;color:var(--muted);font-size:15px;cursor:pointer;background:none;border:none}
.sort-select{background:var(--bg2);border:1px solid var(--border2);border-radius:8px;color:var(--muted);padding:9px 8px;font-size:12px;font-family:var(--sans);outline:none;flex-shrink:0;max-width:108px}
/* Stale / age badges on cards */
.card-age{font-size:10px;font-family:var(--mono);padding:1px 6px;border-radius:3px;background:rgba(255,255,255,.06)}
.card-stale{font-size:9px;font-weight:700;letter-spacing:.4px;padding:2px 7px;border-radius:3px;background:rgba(255,68,68,.15);color:var(--hot);border:1px solid rgba(255,68,68,.35)}
/* ── DEAL LIST ───────────────────────────────────────────── */
#s-list{background:var(--bg)}
.list-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px 14px;display:flex;flex-direction:column;gap:9px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 20px)}
.deal-card{background:var(--bg2);border:1px solid var(--border);border-radius:10px;padding:14px 16px;cursor:pointer;position:relative;overflow:hidden;transition:transform .1s, background .1s}
.deal-card:active{background:var(--bg3);transform:scale(.98)}
.deal-card-accent{position:absolute;left:0;top:0;bottom:0;width:3px}
.card-addr{display:flex;align-items:center;gap:8px;margin-bottom:3px}
.card-addr-text{font-size:15.5px;font-weight:600;line-height:1.3;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.card-chevron{color:var(--muted);font-size:18px;font-weight:400;flex-shrink:0;opacity:.6}
.card-city{font-size:12px;color:var(--muted);margin-bottom:10px}
.card-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.badge{font-size:10px;font-weight:700;padding:3px 9px;border-radius:3px;letter-spacing:1px;text-transform:uppercase}
.b-HOT{background:rgba(255,68,68,.18);color:var(--hot);border:1px solid rgba(255,68,68,.4)}
.b-BUY{background:rgba(68,204,136,.18);color:var(--buy);border:1px solid rgba(68,204,136,.4)}
.b-REVIEW{background:rgba(240,160,48,.18);color:var(--review);border:1px solid rgba(240,160,48,.4)}
.b-PASS{background:rgba(102,136,170,.18);color:var(--pass);border:1px solid rgba(102,136,170,.4)}
.b-HARDNO{background:rgba(204,68,102,.15);color:#cc4466;border:1px solid rgba(204,68,102,.35)}
.b-PENDING{background:rgba(100,100,120,.15);color:var(--muted);border:1px solid var(--border2)}
.card-price{font-family:var(--mono);font-size:13px;font-weight:600;color:var(--accent)}
.card-score{font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:600}
.card-profit{font-family:var(--mono);font-size:12px;font-weight:600}
/* ── DEAL DETAIL ─────────────────────────────────────────── */
#s-deal{background:var(--bg)}
.deal-body{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
.verdict-hdr{padding:18px 16px 4px;display:flex;align-items:center;gap:16px}
.verdict-score{font-family:var(--display);font-size:46px;letter-spacing:1px;line-height:.85}
.verdict-badge-big{font-family:var(--display);font-size:22px;letter-spacing:2px;padding:5px 16px;border-radius:5px;border-width:2px;border-style:solid}
.vb-HOT{background:rgba(255,68,68,.15);color:var(--hot);border-color:rgba(255,68,68,.5)}
.vb-BUY{background:rgba(68,204,136,.15);color:var(--buy);border-color:rgba(68,204,136,.5)}
.vb-REVIEW{background:rgba(240,160,48,.15);color:var(--review);border-color:rgba(240,160,48,.5)}
.vb-PASS{background:rgba(102,136,170,.15);color:var(--pass);border-color:rgba(102,136,170,.5)}
.vb-HARDNO{background:rgba(204,68,102,.12);color:#cc4466;border-color:rgba(204,68,102,.4)}
.vb-PENDING{background:var(--bg3);color:var(--muted);border-color:var(--border2)}
.verdict-reason{font-size:12px;color:var(--muted);line-height:1.5;padding:0 16px 14px}
/* Section card (mirrors desktop .card) */
.card{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:16px;margin:0 16px 12px}
.ct{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin-bottom:12px}
/* Recommendation box (mirrors desktop .rec-box) */
.rec-box{background:linear-gradient(135deg,rgba(200,169,110,.1),rgba(200,169,110,.03));border:1px solid rgba(200,169,110,.3);border-radius:8px;padding:16px;margin:0 16px 14px;position:relative}
.rec-box::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent);border-radius:8px 0 0 8px}
.rec-ct{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:8px}
.rec-txt{font-size:13.5px;line-height:1.65;color:var(--text)}
/* Metric grid */
.metric-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;padding:0 16px 14px}
.metric-tile{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:13px 14px}
.metric-label{font-size:9.5px;color:var(--muted);font-weight:700;letter-spacing:.6px;text-transform:uppercase;margin-bottom:5px}
.metric-val{font-family:var(--display);font-size:24px;letter-spacing:.5px;line-height:1}
.metric-sub{font-size:10px;color:var(--muted);font-family:var(--mono);margin-top:3px}
/* Property rows */
.prow{display:flex;justify-content:space-between;padding:9px 0;border-bottom:1px solid var(--border)}
.prow:last-child{border-bottom:none}
.plbl{font-size:12px;color:var(--muted)}
.pval{font-size:12.5px;font-weight:600;color:var(--text);text-align:right}
/* Seen-by */
.seen-row{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 14px;display:flex;align-items:center;gap:10px;font-size:12px;margin:14px 16px 10px;flex-wrap:wrap}
/* Notes */
.note-bubble{background:var(--bg2);border:1px solid var(--border);border-radius:8px;padding:11px 13px;border-left:3px solid var(--buy);margin-bottom:8px}
.note-bubble.grant-note{border-left-color:var(--accent)}
.note-meta{font-size:10px;color:var(--muted);margin-bottom:5px;display:flex;gap:8px;align-items:center}
.note-author{font-weight:700;letter-spacing:.3px}
.note-text{font-size:13px;color:var(--text);line-height:1.55}
.note-input-wrap{display:flex;flex-direction:column;gap:8px;margin-top:4px}
.note-input{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;color:var(--text);padding:11px 12px;font-size:14px;font-family:var(--sans);outline:none;resize:none;min-height:54px}
.note-input:focus{border-color:var(--accent)}
.note-btn{background:var(--accent);color:#0a0a0f;border:none;border-radius:8px;padding:11px;font-size:13px;font-weight:700;letter-spacing:.5px;text-transform:uppercase;cursor:pointer}
.author-switch{display:flex;background:var(--bg3);border:1px solid var(--border2);border-radius:8px;padding:3px;margin-bottom:14px;width:fit-content}
.auth-btn{padding:7px 18px;border-radius:6px;border:none;font-size:12px;font-weight:700;cursor:pointer;background:transparent;color:var(--muted)}
.auth-btn.active{background:var(--bg2);color:var(--accent)}
/* Negotiation ladder — stacked full-width rows, not cramped columns */
.gap-row{margin:0 16px 14px;padding:11px 14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px}
.gap-top{display:flex;justify-content:space-between;align-items:center;font-size:12px}
.gap-pill{font-size:10px;font-weight:700;padding:3px 10px;border-radius:10px;letter-spacing:.3px}
.gap-bar-wrap{margin-top:8px;height:5px;background:rgba(255,255,255,.08);border-radius:3px;overflow:hidden}
.gap-bar{height:5px;border-radius:3px;transition:width .4s}
.tier-row{margin:0 16px 8px;display:flex;align-items:center;background:var(--bg2);border:1px solid var(--border);border-left-width:4px;border-left-style:solid;border-radius:8px;padding:13px 15px}
.tier-label{font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;width:62px;flex-shrink:0}
.tier-price{font-family:var(--display);font-size:21px;letter-spacing:.5px;flex:1}
.tier-profit{font-family:var(--mono);font-size:12px;font-weight:600;text-align:right}
.counter-row{margin:14px 16px;padding:13px;background:var(--bg2);border:1px solid var(--border);border-radius:8px}
.counter-lbl{font-size:11px;color:var(--muted);margin-bottom:8px}
.counter-input-line{display:flex;align-items:center;gap:6px}
.counter-inp{flex:1;background:var(--bg3);border:1px solid var(--border2);border-radius:6px;color:var(--text);padding:10px 12px;font-size:15px;font-weight:700;font-family:var(--mono);outline:none;width:100%}
.counter-result{margin-top:9px;font-size:13px;font-weight:700;text-align:center}
/* Scripts */
.script-tabs{display:flex;gap:6px;margin:0 16px 10px}
.stab{flex:1;padding:8px 4px;border-radius:6px;font-size:10.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;cursor:pointer;border:1px solid var(--border2);background:transparent;color:var(--muted);text-align:center}
.script-box{margin:0 16px 16px;font-size:13px;color:var(--text);line-height:1.7;padding:14px;background:var(--bg2);border:1px solid var(--border);border-radius:8px;min-height:60px}
.script-eyebrow{color:var(--muted);font-size:9px;font-weight:700;letter-spacing:1.2px;text-transform:uppercase;display:block;margin-bottom:6px}
.copy-btn{margin:0 16px 16px;width:calc(100% - 32px);padding:11px;background:transparent;border:1px solid var(--border2);border-radius:8px;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer;letter-spacing:.3px}
/* Chat */
.chat-messages{display:flex;flex-direction:column;gap:10px;padding:14px 16px 0}
.chat-bubble{border-radius:14px;padding:11px 14px;max-width:88%;font-size:13.5px;line-height:1.55}
.chat-bubble.urban{background:var(--bg2);border:1px solid var(--border);color:var(--text);align-self:flex-start;border-bottom-left-radius:4px}
.chat-bubble.user{background:var(--accent);color:#0a0a0f;font-weight:600;align-self:flex-end;border-bottom-right-radius:4px}
.chat-bubble.thinking{opacity:.5}
.chat-input-wrap{display:flex;gap:9px;padding:11px 14px;background:var(--bg);border-top:1px solid var(--border);position:sticky;bottom:0;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 11px)}
.chat-input{flex:1;background:var(--bg2);border:1px solid var(--border2);border-radius:22px;color:var(--text);padding:11px 17px;font-size:15px;font-family:var(--sans);outline:none}
.chat-send{width:44px;height:44px;background:var(--accent);color:#0a0a0f;border:none;border-radius:50%;font-size:19px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.suggested-chip{cursor:pointer;font-size:11px;padding:6px 12px;border-radius:14px;background:rgba(200,169,110,.1);border:1px solid rgba(200,169,110,.3);color:var(--accent2)}
/* Tab nav (bottom) */
.tab-nav{display:flex;background:var(--bg2);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.tnav{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;padding:11px 0 9px;cursor:pointer;color:var(--muted);font-size:9.5px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border:none;background:none}
.tnav.active{color:var(--accent)}
.tnav-icon{font-size:21px;line-height:1}
/* Loading / Empty */
.loading{display:flex;align-items:center;justify-content:center;flex:1;flex-direction:column;gap:14px;color:var(--muted);font-size:13px;font-family:var(--mono)}
.spin{width:30px;height:30px;border:2px solid var(--border2);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.empty{display:flex;flex-direction:column;align-items:center;justify-content:center;flex:1;gap:12px;color:var(--muted);padding:32px;text-align:center}
.empty-icon{font-size:44px;opacity:.3}
/* Phone link */
.phone-link{display:inline-block;margin-top:10px;font-size:13px;color:var(--accent);text-decoration:none;font-weight:600}
::-webkit-scrollbar{display:none}
</style>
</head>
<body>

<!-- ── LOGIN SCREEN ────────────────────────────────────────── -->
<div class="screen active" id="s-login">
  <div style="text-align:center">
    <div class="logo-m">URBAN</div>
    <div class="logo-sub">Coralstone Underwriter</div>
  </div>
  <div class="login-box">
    <input class="inp" id="token-inp" type="password" placeholder="Password" autocomplete="current-password">
    <button class="btn-primary" onclick="doLogin()">Enter</button>
    <div id="login-err">Wrong password</div>
  </div>
</div>

<!-- ── DEAL LIST SCREEN ────────────────────────────────────── -->
<div class="screen" id="s-list">
  <div class="hdr">
    <div class="hdr-title">URBAN</div>
    <div id="list-count" style="font-size:11px;color:var(--muted);font-family:var(--mono);flex-shrink:0"></div>
    <button class="hdr-icon-btn map-toggle-btn" onclick="openMap()" title="Map view">🗺️</button>
    <button class="hdr-icon-btn" onclick="loadDeals()">↻</button>
  </div>
  <div class="stats-strip" id="stats-strip"></div>
  <div class="search-sort-row">
    <div class="search-wrap">
      <input type="text" class="search-input" id="search-input" placeholder="Search address, city, wholesaler…" oninput="renderList()">
      <button class="search-clear" id="search-clear" onclick="document.getElementById('search-input').value='';renderList();this.style.display='none'">✕</button>
    </div>
    <select class="sort-select" id="sort-select" onchange="renderList()">
      <option value="date-new">↓ Newest</option>
      <option value="date-old">↑ Oldest</option>
      <option value="score-high">↓ Score</option>
      <option value="expires">⏰ Expires</option>
      <option value="ask-low">↑ Price</option>
    </select>
  </div>
  <div class="filter-tabs-wrap"><div class="filter-tabs" id="filter-tabs">
    <button class="ftab active" onclick="setFilter('ALL',this)">All</button>
    <button class="ftab" onclick="setFilter('HOT',this)">🔥 Hot</button>
    <button class="ftab" onclick="setFilter('BUY',this)">Buy</button>
    <button class="ftab" onclick="setFilter('REVIEW',this)">Review</button>
    <button class="ftab" onclick="setFilter('PASS',this)">Pass</button>
    <button class="ftab" onclick="setFilter('PENDING',this)">Pending</button>
  </div></div>
  <div class="list-body" id="deal-list">
    <div class="loading"><div class="spin"></div>Loading deals…</div>
  </div>
</div>

<!-- ── DEAL MAP SCREEN ─────────────────────────────────────── -->
<div class="screen" id="s-map">
  <div class="hdr">
    <button class="hdr-back" onclick="closeMap()"><span class="hdr-back-arrow">‹</span>Deals</button>
    <div class="hdr-title" style="font-size:16px;font-family:var(--sans);font-weight:700;letter-spacing:0">Deal Map</div>
  </div>
  <div id="map-canvas"></div>
  <div class="map-pending-note" id="map-pending-note"><div class="map-spin"></div><span id="map-pending-text"></span></div>
</div>

<!-- ── DEAL DETAIL SCREEN ──────────────────────────────────── -->
<div class="screen" id="s-deal">
  <div class="hdr">
    <button class="hdr-back" onclick="goBack()"><span class="hdr-back-arrow">‹</span>Deals</button>
    <div class="hdr-title" id="d-addr" style="font-size:16px;font-family:var(--sans);font-weight:700;letter-spacing:0">—</div>
  </div>
  <div class="tab-nav" style="border-top:none;border-bottom:1px solid var(--border)">
    <button class="tnav active" onclick="showTab('overview',this)"><div class="tnav-icon">📊</div>Overview</button>
    <button class="tnav" onclick="showTab('notes',this)"><div class="tnav-icon">📝</div>Notes</button>
    <button class="tnav" onclick="showTab('ladder',this)"><div class="tnav-icon">📋</div>Offers</button>
    <button class="tnav" onclick="showTab('chat',this)"><div class="tnav-icon">💬</div>Chat</button>
  </div>
  <div class="deal-body" id="deal-body">
    <div class="loading"><div class="spin"></div></div>
  </div>
</div>

<script>
'use strict';

const BASE = window.location.origin;
let TOKEN = localStorage.getItem('urban_token') || '';
let AUTHOR = localStorage.getItem('urban_author') || 'caleb';
let allDeals = [];
let curFilter = 'ALL';
let curDeal = null;
let curUW = null;
let chatHistory = [];
let uwCache = {}; // uid -> underwrite data. Once a deal is fetched, re-opening it
                   // is instant from here instead of hitting the network again.

// ── UTILS ─────────────────────────────────────────────────────
const fmtK = n => (n || n === 0) ? '$' + (Math.abs(n) >= 1000 ? Math.round(n/1000) + 'K' : Math.round(n)) : '—';
const fmtM = n => n != null ? '$' + Math.round(n).toLocaleString() : '—';
const esc  = s => (s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
function timeAgo(ts) {
  if (!ts) return '';
  const diff = Math.floor((Date.now() - new Date(ts))/1000);
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60) + 'm ago';
  if (diff < 86400) return Math.floor(diff/3600) + 'h ago';
  const d = new Date(ts);
  return (d.getMonth()+1)+'/'+(d.getDate());
}
function vClass(v) {
  if (!v || v === 'PENDING') return 'PENDING';
  if (v === 'HARD NO') return 'HARDNO';
  return v;
}
function accentColor(v) {
  const m = {HOT:'var(--hot)',BUY:'var(--buy)',REVIEW:'var(--review)',PASS:'var(--pass)','HARD NO':'#cc4466',PENDING:'var(--muted)'};
  return m[v] || 'var(--muted)';
}
function api(path, opts) {
  const url = BASE + path;
  const headers = Object.assign({'x-urban-token': TOKEN}, opts && opts.headers || {});
  return fetch(url, Object.assign({}, opts, { headers })).then(function(r) {
    if (!r.ok) throw new Error(r.status);
    return r.json();
  });
}

// ── SCREENS ───────────────────────────────────────────────────
function show(id) {
  document.querySelectorAll('.screen').forEach(function(s) { s.classList.remove('active'); });
  document.getElementById(id).classList.add('active');
}

// ── LOGIN ─────────────────────────────────────────────────────
function doLogin() {
  const t = document.getElementById('token-inp').value.trim();
  if (!t) return;
  TOKEN = t;
  api('/api/stats').then(function(s) {
    localStorage.setItem('urban_token', TOKEN);
    renderStats(s);
    show('s-list');
    loadDeals();
  }).catch(function() {
    document.getElementById('login-err').style.display = 'block';
  });
}

(function() {
  const p = new URLSearchParams(window.location.search);
  const urlToken = p.get('token');
  if (urlToken) {
    TOKEN = urlToken;
    document.getElementById('token-inp').value = urlToken;
  }
})();

if (TOKEN) {
  api('/api/stats').then(function(s) {
    localStorage.setItem('urban_token', TOKEN);
    renderStats(s);
    show('s-list');
    loadDeals();
  }).catch(function() { TOKEN = ''; });
}

document.getElementById('token-inp').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') doLogin();
});

// ── STATS STRIP ───────────────────────────────────────────────
function renderStats(s) {
  const strip = document.getElementById('stats-strip');
  if (!strip || !s) return;
  const total = s.totalUnderwritten || 0;
  const avgScore = s.avgScore ? s.avgScore.toFixed(1) : '—';
  const buyCount = (s.verdicts && (s.verdicts.HOT||0) + (s.verdicts.BUY||0)) || 0;
  const avgProfit = s.avgProfit ? fmtK(s.avgProfit) : '—';
  strip.innerHTML = [
    ['Underwritten', total],
    ['Avg Score', avgScore],
    ['💰 Buy/Hot', buyCount],
    ['Avg Profit', avgProfit],
  ].map(function(p) {
    return '<div class="stat-chip"><div class="stat-chip-val">' + p[1] + '</div><div class="stat-chip-lbl">' + p[0] + '</div></div>';
  }).join('');
}

function loadStats() {
  api('/api/stats').then(renderStats).catch(function(){});
}

// ── DEALS ─────────────────────────────────────────────────────
function loadDeals() {
  document.getElementById('deal-list').innerHTML = '<div class="loading"><div class="spin"></div>Loading…</div>';
  loadStats();
  api('/api/deals').then(function(data) {
    allDeals = data.deals || data || [];
    renderList();
  }).catch(function(e) {
    document.getElementById('deal-list').innerHTML = '<div class="empty"><div class="empty-icon">⚠️</div><div>Could not load deals.<br><small>' + e.message + '</small></div></div>';
  });
}

function setFilter(f, btn) {
  curFilter = f;
  document.querySelectorAll('.ftab').forEach(function(b) { b.classList.remove('active'); });
  btn.classList.add('active');
  renderList();
}

function renderList() {
  const verdictOrder = {HOT:0,BUY:1,REVIEW:2,PASS:3,'HARD NO':4,PENDING:5};
  const q = (document.getElementById('search-input').value || '').toLowerCase().trim();
  const clearBtn = document.getElementById('search-clear');
  if (clearBtn) clearBtn.style.display = q ? 'flex' : 'none';
  const sortBy = document.getElementById('sort-select').value || 'date-new';

  let filtered = allDeals.filter(function(d) {
    const v = d.underwriteStatus || 'PENDING';
    const matchFilter = curFilter === 'ALL' ? true
      : curFilter === 'PENDING' ? (v === 'PENDING' || !d.underwriteStatus)
      : v === curFilter;
    if (!matchFilter) return false;
    if (!q) return true;
    const hay = (d.address+' '+d.city+' '+(d.wholesalerCompany||'')+' '+(d.contact1Name||'')).toLowerCase();
    return hay.indexOf(q) !== -1;
  });

  filtered.sort(function(a, b) {
    if (sortBy === 'expires') {
      const ea = a.expires ? new Date(a.expires) : new Date(9999,0,1);
      const eb = b.expires ? new Date(b.expires) : new Date(9999,0,1);
      return ea - eb;
    }
    if (sortBy === 'date-new') return new Date(b.dateReceived||0) - new Date(a.dateReceived||0);
    if (sortBy === 'date-old') return new Date(a.dateReceived||0) - new Date(b.dateReceived||0);
    if (sortBy === 'score-high') return (b.underwriteScore||0) - (a.underwriteScore||0);
    if (sortBy === 'ask-low') return (parseFloat(a.askingPrice)||999999) - (parseFloat(b.askingPrice)||999999);
    // Default fallback: verdict priority, then score
    const va = verdictOrder[a.underwriteStatus||'PENDING'] ?? 5;
    const vb = verdictOrder[b.underwriteStatus||'PENDING'] ?? 5;
    if (va !== vb) return va - vb;
    return (b.underwriteScore||0) - (a.underwriteScore||0);
  });

  document.getElementById('list-count').textContent = filtered.length;

  if (!filtered.length) {
    document.getElementById('deal-list').innerHTML = q
      ? '<div class="empty"><div class="empty-icon">🔍</div><div>No deals match "' + esc(q) + '"</div></div>'
      : '<div class="empty"><div class="empty-icon">🔍</div><div>No deals in this filter</div></div>';
    return;
  }

  document.getElementById('deal-list').innerHTML = filtered.map(function(d) {
    const v = d.underwriteStatus || 'PENDING';
    const fi = d.financials || {};
    const _uvArv = (d.arv && d.arv.urbanARV) || 0;
    const _fiAsk = fi.askingPrice && parseFloat(fi.askingPrice) > 1000 ? parseFloat(fi.askingPrice) : 0;
    const _rawAsk = parseFloat(d.askingPrice) || 0;
    const ask = _fiAsk || (_rawAsk >= 1000 ? _rawAsk : 0);
    const profit = (fi.netProfitAtAsking != null) ? fi.netProfitAtAsking : null;
    const profitColor = profit > 0 ? 'var(--buy)' : profit < 0 ? 'var(--hot)' : 'var(--muted)';
    const uid = d.uid || (d.address + '-' + (d.dateReceived||''));

    // Age + stale — same thresholds desktop uses
    let ageLabel = '';
    if (d.daysOld != null) {
      ageLabel = d.daysOld === 0 ? '🟢 Today' : d.daysOld === 1 ? '🟡 1d' : d.daysOld <= 3 ? '🟡 ' + d.daysOld + 'd' : d.daysOld <= 7 ? '🟠 ' + d.daysOld + 'd' : '🔴 ' + d.daysOld + 'd';
    }
    const staleHtml = d.isStale ? '<span class="card-stale">⏰ STALE</span>' : '';

    return '<div class="deal-card" data-uid="' + esc(uid) + '">' +
      '<div class="deal-card-accent" style="background:' + accentColor(v) + '"></div>' +
      '<div class="card-addr"><span class="card-addr-text">' + esc(d.address||'Unknown') + '</span><span class="card-chevron">›</span></div>' +
      '<div class="card-city">' + esc((d.city||'') + (d.state ? ', '+d.state : '')) + '</div>' +
      '<div class="card-meta">' +
        '<span class="badge b-' + vClass(v) + '">' + (v==='HARD NO'?'HARD NO':v) + '</span>' +
        (d.underwriteScore ? '<span class="card-score">' + d.underwriteScore + '/10</span>' : '') +
        (ask > 0 ? '<span class="card-price">' + fmtK(ask) + '</span>' : '') +
        (profit != null ? '<span class="card-profit" style="color:' + profitColor + '">' + (profit>0?'+':'') + fmtK(profit) + '</span>' : '') +
        (ageLabel ? '<span class="card-age">' + ageLabel + '</span>' : '') +
        staleHtml +
      '</div>' +
    '</div>';
  }).join('');
}

// Single delegated listener — handles every card, present or future, with zero
// per-card string-escaping risk. This is the fix for the "cards aren't
// clickable" bug: the old approach embedded the uid into an inline onclick="
// attribute via JSON.stringify, which wraps strings in DOUBLE quotes — those
// collided with the onclick="" attribute's own double quotes and corrupted
// the handler on every single card.
document.getElementById('deal-list').addEventListener('click', function(e) {
  const card = e.target.closest('.deal-card');
  if (!card) return;
  openDeal(card.dataset.uid);
});

// ── DEAL MAP ──────────────────────────────────────────────────
// Tampa Bay center — CCG's buy box (Pasco/Hillsborough/Hernando)
const MAP_DEFAULT_CENTER = [28.15, -82.45];
let leafletMap = null;
let mapMarkers = [];
let geoCache = {};
try { geoCache = JSON.parse(localStorage.getItem('urban_geo_cache') || '{}'); } catch(e) { geoCache = {}; }

function saveGeoCache() {
  try { localStorage.setItem('urban_geo_cache', JSON.stringify(geoCache)); } catch(e) {}
}

function openMap() {
  show('s-map');
  if (!leafletMap) {
    leafletMap = L.map('map-canvas', { zoomControl: true, attributionControl: true })
      .setView(MAP_DEFAULT_CENTER, 10);
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 19,
      attribution: '© OpenStreetMap'
    }).addTo(leafletMap);
  }
  // Leaflet needs a resize kick when its container was display:none during init
  setTimeout(function() { leafletMap.invalidateSize(); plotMapPins(); }, 60);
}

function closeMap() {
  show('s-list');
}

function mapPinColor(v) {
  const m = {HOT:'#ff4444', BUY:'#44cc88', REVIEW:'#f0a030', PASS:'#6688aa', 'HARD NO':'#cc4466', PENDING:'#666680'};
  return m[v] || '#666680';
}

function plotMapPins() {
  mapMarkers.forEach(function(m) { leafletMap.removeLayer(m); });
  mapMarkers = [];

  const dealsForMap = allDeals.filter(function(d) {
    const v = d.underwriteStatus || 'PENDING';
    if (curFilter === 'ALL') return true;
    if (curFilter === 'PENDING') return v === 'PENDING' || !d.underwriteStatus;
    return v === curFilter;
  });

  const located = [];
  const missing = [];
  let unmappable = 0;
  dealsForMap.forEach(function(d) {
    const uid = d.uid || (d.address + '-' + d.dateReceived);
    const geo = geoCache[uid];
    if (geo && geo.lat != null) located.push({ d: d, uid: uid, geo: geo });
    else if (geo && geo.failed) unmappable++; // tried before, couldn't locate it — don't ask again
    else missing.push({ uid: uid, address: d.address, city: d.city });
  });

  located.forEach(function(item) {
    const d = item.d;
    const v = d.underwriteStatus || 'PENDING';
    const fi = d.financials || {};
    const _fiAsk = fi.askingPrice && parseFloat(fi.askingPrice) > 1000 ? parseFloat(fi.askingPrice) : 0;
    const _rawAsk = parseFloat(d.askingPrice) || 0;
    const ask = _fiAsk || (_rawAsk >= 1000 ? _rawAsk : 0);
    const color = mapPinColor(v);

    const marker = L.circleMarker([item.geo.lat, item.geo.lng], {
      radius: 9, fillColor: color, color: '#0a0a0f', weight: 2, fillOpacity: 0.9
    }).addTo(leafletMap);

    const popupHtml = '<div class="map-pin-addr">' + esc(d.address||'') + '</div>' +
      '<div class="map-pin-city">' + esc((d.city||'')+(d.state?', '+d.state:'')) + '</div>' +
      '<div class="map-pin-meta">' +
        '<span class="badge b-' + vClass(v) + '">' + (v==='HARD NO'?'HARD NO':v) + '</span>' +
        (d.underwriteScore ? '<span class="card-score">' + d.underwriteScore + '/10</span>' : '') +
        (ask > 0 ? '<span class="card-price">' + fmtK(ask) + '</span>' : '') +
      '</div>' +
      '<button class="map-pin-btn" onclick="closeMap();setTimeout(function(){openDeal(' + "'" + item.uid.replace(/'/g,"\\'") + "'" + ')},80)">View Deal</button>';
    marker.bindPopup(popupHtml);
    mapMarkers.push(marker);
  });

  if (located.length) {
    const bounds = L.latLngBounds(located.map(function(item) { return [item.geo.lat, item.geo.lng]; }));
    leafletMap.fitBounds(bounds, { padding: [40, 40], maxZoom: 14 });
  }

  const note = document.getElementById('map-pending-note');
  const noteText = document.getElementById('map-pending-text');
  const noteSpin = note ? note.querySelector('.map-spin') : null;
  if (missing.length) {
    note.style.display = 'flex';
    if (noteSpin) noteSpin.style.display = '';
    noteText.textContent = 'Locating ' + missing.length + ' more propert' + (missing.length===1?'y':'ies') + '…';
    geocodeMissingDeals(missing);
  } else if (unmappable && note) {
    note.style.display = 'flex';
    if (noteSpin) noteSpin.style.display = 'none';
    noteText.textContent = unmappable + ' propert' + (unmappable===1?'y':'ies') + ' could not be located on the map';
  } else if (note) {
    note.style.display = 'none';
  }
}

function geocodeMissingDeals(missing) {
  const items = missing.slice(0, 60).map(function(m) { return { uid: m.uid, address: m.address, city: m.city }; });
  if (!items.length) return;
  api('/api/geocode-batch', {
    method: 'POST', headers: {'Content-Type':'application/json'},
    body: JSON.stringify({ items: items })
  }).then(function(result) {
    Object.keys(result).forEach(function(uid) { geoCache[uid] = result[uid]; });
    // Anything we asked for but didn't get coordinates back for failed
    // server-side — remember that here too so we stop asking every time.
    items.forEach(function(it) {
      if (!result[it.uid]) geoCache[it.uid] = { failed: true };
    });
    saveGeoCache();
    const note = document.getElementById('map-pending-note');
    if (note) note.style.display = 'none';
    if (document.getElementById('s-map').classList.contains('active')) plotMapPins();
  }).catch(function() {
    const note = document.getElementById('map-pending-note');
    if (note) note.style.display = 'none';
  });
}

// ── DEAL DETAIL ───────────────────────────────────────────────
function openDeal(uid) {
  curDeal = allDeals.find(function(d) { return (d.uid||(d.address+'-'+d.dateReceived)) === uid; });
  if (!curDeal) return;
  chatHistory = [];
  show('s-deal');
  api('/api/seen/' + encodeURIComponent(uid), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({author:AUTHOR})
  }).catch(function(){});

  if (uwCache[uid]) {
    // Already have this one — show it instantly, no spinner, no network wait.
    curUW = uwCache[uid];
    renderDetail('overview');
  } else {
    curUW = null;
    renderDetail('overview');
  }

  // Always refresh in the background so data can't go stale forever (e.g. someone
  // re-ran the underwrite on desktop) — but the UI never has to wait on this if
  // a cached copy is already showing.
  api('/api/underwrite/' + encodeURIComponent(uid)).then(function(uw) {
    uwCache[uid] = uw;
    if (curDeal && (curDeal.uid||(curDeal.address+'-'+curDeal.dateReceived)) === uid) {
      curUW = uw;
      const activeTab = document.querySelector('.deal-body').dataset.tab || 'overview';
      renderDetail(activeTab);
    }
  }).catch(function(){});
}

function goBack() {
  show('s-list');
  curDeal = null;
  curUW = null;
}

// Edge-swipe to go back, like iOS's native gesture. Only arms when the touch
// starts within 24px of the left edge — anywhere else on screen is left alone
// so it never fights the horizontal-scrolling filter/subtab pill strips.
(function() {
  let sx = 0, sy = 0, tracking = false;
  const dealScreen = document.getElementById('s-deal');
  dealScreen.addEventListener('touchstart', function(e) {
    const t = e.touches[0];
    tracking = t.clientX < 24;
    sx = t.clientX; sy = t.clientY;
  }, { passive: true });
  dealScreen.addEventListener('touchend', function(e) {
    if (!tracking) return;
    tracking = false;
    const t = e.changedTouches[0];
    const dx = t.clientX - sx, dy = t.clientY - sy;
    if (dx > 70 && Math.abs(dy) < 50) goBack();
  }, { passive: true });
})();

function showTab(tab, btn) {
  document.querySelectorAll('#s-deal .tnav').forEach(function(b){b.classList.remove('active');});
  btn.classList.add('active');
  renderDetail(tab);
}

function renderDetail(tab) {
  const d = curDeal;
  if (!d) return;
  const uid = d.uid || (d.address + '-' + d.dateReceived);
  const v = d.underwriteStatus || 'PENDING';
  document.getElementById('d-addr').textContent = d.address || '—';
  document.getElementById('deal-body').dataset.tab = tab;

  if (tab === 'overview') renderOverviewWrap(d, curUW, uid);
  else if (tab === 'notes') renderNotesTab(uid);
  else if (tab === 'ladder') renderLadder(curUW);
  else if (tab === 'chat') renderChat();
}

// Overview hosts its own horizontal sub-tab strip — Summary / ARV / Rehab /
// Financials / Property / Flags — so the depth that used to only exist on
// desktop is actually reachable on mobile, without overloading the bottom nav.
let curSubtab = 'summary';
const SUBTABS = [
  ['summary','Summary'], ['arv','ARV'], ['rehab','Rehab'],
  ['financials','Financials'], ['property','Property'], ['flags','Flags']
];

function renderOverviewWrap(d, uw, uid) {
  let html = '<div class="subtab-wrap"><div class="subtab-row" id="subtab-row">' +
    SUBTABS.map(function(s) {
      return '<button class="subtab' + (curSubtab===s[0]?' active':'') + '" data-s="' + s[0] + '" onclick="setSubtab(\'' + s[0] + '\')">' + s[1] + '</button>';
    }).join('') + '</div></div>' +
    '<div id="subtab-content"></div>';
  document.getElementById('deal-body').innerHTML = html;
  renderSubtabContent(d, uw, uid);
}

function setSubtab(name) {
  curSubtab = name;
  document.querySelectorAll('#subtab-row .subtab').forEach(function(b) {
    b.classList.toggle('active', b.dataset.s === name);
  });
  renderSubtabContent(curDeal, curUW, curDeal && (curDeal.uid || (curDeal.address+'-'+curDeal.dateReceived)));
}

function renderSubtabContent(d, uw, uid) {
  const el = document.getElementById('subtab-content');
  if (!el) return;
  if (curSubtab === 'summary') return renderOverview(d, uw, uid, el);
  if (curSubtab === 'arv') return renderARVTab(d, uw, el);
  if (curSubtab === 'rehab') return renderRehabTab(d, uw, el);
  if (curSubtab === 'financials') return renderFinancialsTab(d, uw, el);
  if (curSubtab === 'property') return renderPropertyTab(d, el);
  if (curSubtab === 'flags') return renderFlagsTab(uw, el);
}

function renderOverview(d, uw, uid, targetEl) {
  const fi = (uw && uw.financials) || d.financials || {};
  const arv = (uw && uw.arv && uw.arv.urbanARV) || (d.arv && d.arv.urbanARV) || 0;
  const rehab = (uw && uw.rehab && uw.rehab.urbanEstimate) || 0;
  const _fiAsk = fi.askingPrice && parseFloat(fi.askingPrice) > 1000 ? parseFloat(fi.askingPrice) : 0;
  const _rawAsk = parseFloat(d.askingPrice) || 0;
  const ask = _fiAsk || (_rawAsk >= 1000 ? _rawAsk : 0);
  const costs = (fi.holdingCosts && fi.holdingCosts.total || 0) + (fi.sellingCosts && fi.sellingCosts.total || (arv*0.075)) +
                (fi.hardMoney && fi.hardMoney.totalInterest || 0) + (fi.hardMoney && fi.hardMoney.originationPoints || 0);
  const profit = (arv > 0 && ask > 0) ? Math.round(arv - ask - rehab - costs) : (fi.netProfitAtAsking != null ? fi.netProfitAtAsking : null);
  const mao = fi.mao || (arv ? Math.round(arv*0.7 - rehab) : 0);
  const score = d.underwriteScore || (uw && uw.score) || 0;
  const reason = (uw && uw.verdictReason) || d.verdictReason || '';
  const rec = (uw && uw.recommendation) || '';
  const v = d.underwriteStatus || 'PENDING';

  let html = '';

  html += '<div class="verdict-hdr">';
  if (score) html += '<div class="verdict-score" style="color:' + accentColor(v) + '">' + score + '<span style="font-size:18px;color:var(--muted);font-family:var(--sans)">/10</span></div>';
  html += '<span class="verdict-badge-big vb-' + vClass(v) + '">' + (v==='HARD NO'?'HARD NO':v) + '</span>';
  html += '</div>';
  if (reason) html += '<div class="verdict-reason">' + esc(reason) + '</div>';

  if (rec) {
    html += '<div class="rec-box"><div class="rec-ct">Urban\'s Take</div><div class="rec-txt">' + esc(rec) + '</div></div>';
  }

  html += '<div class="metric-grid">';
  const tiles = [
    {label:'Asking', val: ask ? fmtK(ask) : '—', sub: ask ? fmtM(ask) : '', color:'var(--text)'},
    {label:'Urban ARV', val: arv ? fmtK(arv) : '—', sub: arv ? fmtM(arv) : '', color:'var(--accent)'},
    {label:'Rehab Est.', val: rehab ? fmtK(rehab) : '—', sub:'', color:'var(--review)'},
    {label:'MAO (70% − R)', val: mao ? fmtK(mao) : '—', sub:'', color:'var(--accent2)'},
    {label:'Profit @ Ask', val: profit != null ? (profit>0?'+':'')+fmtK(profit) : '—', sub:'', color: profit>0?'var(--buy)':profit<0?'var(--hot)':'var(--muted)'},
    {label:'ROI', val: fi.roi ? fi.roi+'%' : '—', sub:'', color:'var(--text)'},
  ];
  tiles.forEach(function(t){
    html += '<div class="metric-tile"><div class="metric-label">' + t.label + '</div>' +
      '<div class="metric-val" style="color:' + t.color + '">' + t.val + '</div>' +
      (t.sub ? '<div class="metric-sub">' + t.sub + '</div>' : '') + '</div>';
  });
  html += '</div>';

  html += '<div class="card"><div class="ct">Property</div>';
  const rows = [
    ['City', (d.city||'')+(d.state?', '+d.state:'')+(d.zip?' '+d.zip:'')],
    ['County', d.county],
    ['Beds / Baths', d.beds && d.baths ? d.beds+' bd · '+d.baths+' ba' : null],
    ['Sqft', d.sqft ? parseInt(d.sqft).toLocaleString()+' sf' : null],
    ['Year Built', d.yearBuilt],
    ['Construction', d.construction],
    ['Wholesaler ARV', d.wholesalerARV ? fmtM(d.wholesalerARV) : null],
  ].filter(function(r){return r[1];});
  rows.forEach(function(r){
    html += '<div class="prow"><span class="plbl">' + esc(r[0]) + '</span><span class="pval">' + esc(String(r[1])) + '</span></div>';
  });
  html += '</div>';

  const wsName = d.contact1Company || d.wholesalerCompany || d.contact1Name || '';
  const wsPhone = d.contact1Phone || '';
  if (wsName) {
    html += '<div class="card"><div class="ct">Source</div>';
    html += '<div style="font-size:14px;font-weight:600">' + esc(wsName) + '</div>';
    if (d.contact1Name && d.contact1Company) html += '<div style="font-size:12px;color:var(--muted);margin-top:2px">' + esc(d.contact1Name) + '</div>';
    if (wsPhone) html += '<a class="phone-link" href="tel:' + esc(wsPhone) + '">📞 ' + esc(wsPhone) + '</a>';
    html += '</div>';
  }

  document.getElementById('subtab-content').innerHTML = html;
}

// ── ARV TAB — comps, confidence, as-is vs full-rehab spread ───────────────────
function renderARVTab(d, uw, el) {
  if (!uw) { el.innerHTML = emptyState('⚡', 'Run a full underwrite to see ARV analysis and comps.'); return; }
  const arv = uw.arv || {};
  const conf = arv.arvConfidence || 'LOW';
  const confColor = conf==='HIGH' ? 'var(--buy)' : conf==='MEDIUM' ? 'var(--review)' : 'var(--hot)';
  const wsArv = arv.wholesalerARV || 0;
  const urArv = arv.urbanARV || 0;
  const diff = wsArv - urArv;

  let html = '<div class="card" style="margin-top:14px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">' +
    '<div class="ct" style="margin-bottom:0">Confidence</div>' +
    '<span class="badge" style="background:' + confColor + '22;color:' + confColor + ';border-color:' + confColor + '66">' + conf + '</span></div>';
  html += '<div style="display:flex;gap:10px;margin-bottom:10px">' +
    '<div style="flex:1"><div class="metric-label">Wholesaler ARV</div><div style="font-family:var(--mono);font-size:16px;color:var(--review);font-weight:700">' + fmtM(wsArv) + '</div></div>' +
    '<div style="flex:1"><div class="metric-label">Urban ARV</div><div style="font-family:var(--mono);font-size:16px;color:var(--accent);font-weight:700">' + fmtM(urArv) + '</div></div>' +
  '</div>';
  if (wsArv && urArv) {
    const diffColor = diff > 10000 ? 'var(--hot)' : diff < -10000 ? 'var(--buy)' : 'var(--muted)';
    const diffTxt = diff > 1000 ? 'Wholesaler inflated by ' + fmtK(diff) : diff < -1000 ? 'Wholesaler undervalued — upside ' + fmtK(Math.abs(diff)) : 'Matches Urban';
    html += '<div class="prow"><span class="plbl">Variance</span><span class="pval" style="color:' + diffColor + '">' + diffTxt + '</span></div>';
  }
  if (arv.asIsValue) html += '<div class="prow"><span class="plbl">As-Is Value</span><span class="pval">' + fmtM(arv.asIsValue) + '</span></div>';
  if (arv.arvPerSqft) html += '<div class="prow"><span class="plbl">$ / sqft</span><span class="pval">$' + Math.round(arv.arvPerSqft) + '/sf</span></div>';
  if (arv.arvNotes) html += '<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:12.5px;color:var(--text);line-height:1.6">' + esc(arv.arvNotes) + '</div>';
  html += '</div>';

  const comps = uw.comps || [];
  html += '<div style="padding:0 16px"><div class="ct" style="margin-top:4px">Comparable Sales (' + comps.length + ')</div></div>';
  if (!comps.length) {
    html += '<div style="padding:0 16px"><div style="font-size:12.5px;color:var(--muted);padding:10px 0">No live comps loaded — hit Re-run on desktop to pull fresh comps.</div></div>';
  } else {
    html += '<div style="padding:0 16px 16px">';
    comps.forEach(function(c) {
      const price = c.salePrice || c.sold_price || 0;
      const date = (c.saleDate || c.sold_date || '').slice(0,10);
      const ppsf = c.ppsf ? Math.round(parseFloat(c.ppsf)) : (price && c.sqft ? Math.round(price/c.sqft) : null);
      html += '<div class="comp-card">' +
        '<div class="comp-addr">' + esc(c.address||'—') + '</div>' +
        '<div class="comp-row"><span>' + (c.beds||'?') + 'bd / ' + (c.baths||'?') + 'ba · ' + (c.sqft?parseInt(c.sqft).toLocaleString()+' sf':'—') + '</span><span class="comp-price">' + fmtM(price) + '</span></div>' +
        '<div class="comp-row"><span>' + (ppsf ? '$'+ppsf+'/sf' : '') + '</span><span>' + date + '</span></div>' +
      '</div>';
    });
    html += '</div>';
  }
  el.innerHTML = html;
}

// ── REHAB TAB — scope + full line-item breakdown ───────────────────────────
function renderRehabTab(d, uw, el) {
  if (!uw || !uw.rehab) { el.innerHTML = emptyState('⚡', 'Run a full underwrite to see the rehab breakdown.'); return; }
  const r = uw.rehab;
  const items = r.lineItems || {};
  const order = ['roof','hvac','plumbing','electrical','kitchen','bathrooms','flooring','windows','paint','landscaping','permits','misc','contingency','other'];

  let html = '<div class="card" style="margin-top:14px">';
  html += '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">' +
    '<span class="badge b-REVIEW">' + (r.scopeLevel||'MEDIUM') + '</span>' +
    '<span style="font-size:11px;color:var(--muted)">' + (uw.financials && uw.financials.holdMonths || 5) + ' month hold</span></div>';
  html += '</div>';

  html += '<div class="card">';
  let tot = 0;
  let any = false;
  order.forEach(function(k) {
    const v = items[k];
    if (!v) return;
    any = true; tot += v;
    html += '<div class="rehab-line"><span class="rehab-line-name">' + k + '</span><span class="rehab-line-val">' + fmtM(v) + '</span></div>';
  });
  Object.keys(items).forEach(function(k) {
    if (order.indexOf(k) === -1 && items[k]) { any = true; tot += items[k]; html += '<div class="rehab-line"><span class="rehab-line-name">' + esc(k.replace(/_/g,' ')) + '</span><span class="rehab-line-val">' + fmtM(items[k]) + '</span></div>'; }
  });
  if (!any) html += '<div style="font-size:12.5px;color:var(--muted);padding:8px 0">No itemized breakdown in this underwrite yet.</div>';
  else html += '<div class="rehab-total"><span style="font-weight:700;font-size:13px">TOTAL</span><span style="font-family:var(--mono);font-weight:800;color:var(--accent);font-size:15px">' + fmtM(tot) + '</span></div>';
  if (r.urbanEstimateRange) html += '<div style="font-size:11px;color:var(--muted);margin-top:8px">Range: ' + fmtM(r.urbanEstimateRange.low) + ' – ' + fmtM(r.urbanEstimateRange.high) + '</div>';
  html += '</div>';

  if (r.wholesalerEstimate || r.confidence) {
    html += '<div class="card">';
    if (r.wholesalerEstimate) html += '<div class="prow"><span class="plbl">Wholesaler Estimate</span><span class="pval" style="color:var(--review)">' + fmtM(r.wholesalerEstimate) + '</span></div>';
    html += '<div class="prow"><span class="plbl">Urban Estimate</span><span class="pval">' + fmtM(r.urbanEstimate) + '</span></div>';
    if (r.confidence) html += '<div class="prow"><span class="plbl">Confidence</span><span class="pval">' + r.confidence + '</span></div>';
    html += '</div>';
  }
  if (r.notes) html += '<div class="card"><div class="ct">Notes</div><div style="font-size:12.5px;color:var(--text);line-height:1.6">' + esc(r.notes) + '</div></div>';
  if (r.missingInfo) html += '<div class="card" style="border-color:rgba(240,160,48,.3)"><div class="ct" style="color:var(--review)">⚠️ Missing Info</div><div style="font-size:12.5px;color:var(--text);line-height:1.6">' + esc(r.missingInfo) + '</div></div>';

  el.innerHTML = html;
}

// ── FINANCIALS TAB — full breakdown matching desktop's 4-card layout ──────────
function renderFinancialsTab(d, uw, el) {
  if (!uw) { el.innerHTML = emptyState('⚡', 'Run a full underwrite to see full financials.'); return; }
  const f = uw.financials || {};
  const arv = (uw.arv && uw.arv.urbanARV) || 0;
  const rehab = (uw.rehab && uw.rehab.urbanEstimate) || 0;
  const _fiAsk = f.askingPrice && parseFloat(f.askingPrice) > 1000 ? parseFloat(f.askingPrice) : 0;
  const _rawAsk = parseFloat(d.askingPrice) || 0;
  const ask = _fiAsk || (_rawAsk >= 1000 ? _rawAsk : 0);
  const mao = f.mao || Math.round(arv*0.7 - rehab);
  const loan = (f.hardMoney && f.hardMoney.loanAmount) || Math.round(ask*0.9);
  const dp = Math.round(ask*0.1);
  const interest = (f.hardMoney && f.hardMoney.totalInterest) || 0;
  const points = (f.hardMoney && f.hardMoney.originationPoints) || Math.round(loan*0.02);
  const holding = (f.holdingCosts && f.holdingCosts.total) || 0;
  const selling = (f.sellingCosts && f.sellingCosts.total) || Math.round(arv*0.075);
  const financing = interest + points;
  const totalAllIn = ask + rehab + financing + holding + selling;
  const profit = arv > 0 ? Math.round(arv - totalAllIn) : null;
  const ctc = dp + rehab;
  const roi = totalAllIn > 0 && profit != null ? (profit/totalAllIn*100).toFixed(1) : null;
  const coc = ctc > 0 && profit != null ? (profit/ctc*100).toFixed(1) : null;

  function row(lbl, val, color) { return '<div class="prow"><span class="plbl">' + lbl + '</span><span class="pval"' + (color?' style="color:'+color+'"':'') + '>' + val + '</span></div>'; }

  let html = '<div class="card" style="margin-top:14px"><div class="ct">Deal Economics</div>';
  html += row('Asking Price', fmtM(ask));
  html += row("Urban's ARV", fmtM(arv), 'var(--accent)');
  html += row('Rehab Budget', fmtM(rehab));
  html += row('MAO (70% − Repairs)', fmtM(mao));
  html += row('Asking vs MAO', (ask-mao>0?'+':'')+fmtK(ask-mao), ask>mao?'var(--hot)':'var(--buy)');
  html += '</div>';

  html += '<div class="card"><div class="ct">Hard Money · 9.5% Interest Only</div>';
  html += row('Loan Amount (90% LTV)', fmtM(loan));
  html += row('Down Payment (10%)', fmtM(dp));
  html += row('Total Interest', fmtM(interest));
  html += row('Origination (2 pts)', fmtM(points));
  html += row('Total Financing Cost', fmtM(financing));
  html += '</div>';

  html += '<div class="card"><div class="ct">All-In Cost Breakdown</div>';
  html += row('Purchase Price', fmtM(ask));
  html += row('Rehab', fmtM(rehab));
  html += row('Financing', fmtM(financing));
  html += row('Holding Costs', fmtM(holding));
  html += row('Selling Costs', fmtM(selling));
  html += '<div class="rehab-total"><span style="font-weight:700;font-size:13px">TOTAL ALL-IN</span><span style="font-family:var(--mono);font-weight:800;font-size:15px">' + fmtM(totalAllIn) + '</span></div>';
  html += '<div style="margin-top:8px;padding:9px 11px;background:rgba(200,169,110,.08);border-radius:6px;display:flex;justify-content:space-between">' +
    '<span style="font-size:12px;font-weight:600">Cash to Close</span><span style="font-family:var(--mono);font-weight:700;color:var(--accent)">' + fmtM(ctc) + '</span></div>';
  html += '</div>';

  html += '<div class="card"><div class="ct">Profit &amp; Returns</div>';
  html += '<div style="text-align:center;padding:6px 0 12px"><div class="metric-label">Net Profit @ Asking</div>' +
    '<div style="font-family:var(--display);font-size:30px;color:' + (profit>0?'var(--buy)':'var(--hot)') + '">' + (profit!=null?(profit>0?'+':'')+fmtM(profit):'—') + '</div></div>';
  html += row('Return on All-In', roi!=null ? roi+'%' : '—');
  html += row('Cash-on-Cash', coc!=null ? coc+'%' : '—', 'var(--buy)');
  html += '</div>';

  el.innerHTML = html;
}

// ── PROPERTY TAB — every field from the sheet, organized like desktop ─────────
function renderPropertyTab(d, el) {
  function row(lbl, val) {
    if (val === null || val === undefined || val === '' || val === '0' || val === false) return '';
    return '<div class="prow"><span class="plbl">' + lbl + '</span><span class="pval">' + esc(String(val)) + '</span></div>';
  }
  function money(v) { return v && parseFloat(v) ? fmtM(parseFloat(v)) : null; }
  function section(title, rows) {
    const content = rows.filter(Boolean).join('');
    if (!content) return '';
    return '<div class="card"><div class="ct">' + title + '</div>' + content + '</div>';
  }
  function hasFlag(x) { return x && !['no','n/a','none','x',''].includes(String(x).toLowerCase().trim()); }

  let html = '<div style="margin-top:14px"></div>';
  html += section('Property', [
    row('Address', d.address),
    row('City / State / Zip', [d.city, d.state, d.zip].filter(Boolean).join(', ')),
    row('County', d.county),
    row('Subdivision', d.subdivision),
    row('School District', d.schoolDistrict),
    row('Type', d.propertyType),
    row('Beds / Baths', d.beds && d.baths ? d.beds+' bd · '+d.baths+' ba' : null),
    row('Sqft', d.sqft ? parseInt(d.sqft).toLocaleString()+' sf' : null),
    row('Lot Size', d.lotSqft ? parseInt(d.lotSqft).toLocaleString()+' sf' : null),
    row('Year Built', d.yearBuilt),
    row('Stories', d.stories),
    row('Construction', d.construction),
    row('Foundation', d.foundation),
    row('Occupancy', d.occupancy),
    row('Pool', d.pool && String(d.pool).toLowerCase()!=='no' ? 'Yes' : null),
    row('Garage', d.garage && String(d.garage).toLowerCase()!=='no' ? (d.garageSpaces ? d.garageSpaces+' spaces' : 'Yes') : null),
    row('Flood Zone', hasFlag(d.floodZone) ? d.floodZone : null),
    row('HOA', hasFlag(d.hoa) ? d.hoa + (d.hoaFee ? ' — '+money(d.hoaFee)+'/mo' : '') : null),
  ]);
  html += section('Wholesaler Numbers', [
    row('Asking Price', money(d.askingPrice)),
    row('Wholesaler ARV', money(d.wholesalerARV)),
    row('Repairs Estimate', money(d.repairsEstimate)),
    row('Assignment Fee', money(d.assignmentFee)),
    row('Annual Taxes', money(d.annualTaxes)),
    row('Rent (Current)', money(d.rentCurrent)),
    row('Rent (Market Est)', money(d.rentMarket)),
    row('Close Date', d.closeDate),
    row('Inspection Period', d.inspectionPeriod),
    row('Earnest Money', money(d.earnestMoney)),
    row('Cash Only', d.cashOnly && String(d.cashOnly)!=='false' ? 'Yes' : null),
  ]);
  html += section('Systems & Condition', [
    row('Overall Condition', d.overall_condition),
    row('Roof', [d.roofType, d.roofAge].filter(Boolean).join(' · ')),
    row('HVAC / AC', d.acYear),
    row('Water Heater', d.waterHeater),
    row('Electrical', d.electrical),
    row('Plumbing', d.plumbing),
    row('Windows', d.windows),
    row('Flooring', d.flooring),
  ]);
  const condNotes = [
    ['Kitchen', d.kitchenNotes], ['Bathrooms', d.bathNotes],
    ["What's Updated", d.whatIsUpdated], ['Needs Work', d.whatNeedsWork],
    ['Highlights', d.highlights], ['Red Flags', d.redFlags], ['Notes', d.additionalNotes]
  ].filter(function(p){return p[1];});
  if (condNotes.length) {
    html += '<div class="card"><div class="ct">Condition Notes</div>';
    condNotes.forEach(function(p) {
      html += '<div style="margin-bottom:10px"><div style="font-size:10px;color:var(--muted);text-transform:uppercase;letter-spacing:.4px;margin-bottom:3px">' + p[0] + '</div><div style="font-size:12.5px;color:var(--text);line-height:1.55">' + esc(p[1]) + '</div></div>';
    });
    html += '</div>';
  }
  html += section('Seller', [
    row('Name', d.sellerName), row('Phone', d.sellerPhone),
    row('Situation', d.sellerSituation), row('Motivation', d.sellerMotivation),
  ]);
  html += section('Wholesaler Contact', [
    row('Company', d.wholesalerCompany || d.contact1Company),
    row('Contact', d.contact1Name),
    row('Phone', d.contact1Phone),
    row('Email', d.contact1Email),
  ]);

  if (d.googleMapsLink || d.zillowLink) {
    html += '<div class="card"><div class="ct">Links</div>';
    if (d.zillowLink) html += '<a class="phone-link" href="' + esc(d.zillowLink) + '" target="_blank" rel="noopener" style="display:block;margin-bottom:8px">🔗 View on Zillow</a>';
    if (d.googleMapsLink) html += '<a class="phone-link" href="' + esc(d.googleMapsLink) + '" target="_blank" rel="noopener" style="display:block">📍 Open in Google Maps</a>';
    html += '</div>';
  }

  el.innerHTML = html || emptyState('📋', 'No property data available.');
}

// ── FLAGS TAB — risk flags, severity-sorted ────────────────────────────────
function renderFlagsTab(uw, el) {
  if (!uw || !uw.riskFlags || !uw.riskFlags.length) {
    el.innerHTML = emptyState('🔍', 'No risk flags identified yet — run a full underwrite for risk analysis.');
    return;
  }
  const order = {HIGH:0, MEDIUM:1, LOW:2};
  const sorted = uw.riskFlags.slice().sort(function(a,b) { return (order[a.severity]||3) - (order[b.severity]||3); });
  let html = '<div style="padding:16px 16px 0">';
  sorted.forEach(function(f) {
    const sev = (f.severity||'LOW').toUpperCase();
    const icon = sev==='HIGH' ? '🔴' : sev==='MEDIUM' ? '🟡' : '🔵';
    const sevColor = sev==='HIGH' ? 'var(--hot)' : sev==='MEDIUM' ? 'var(--review)' : 'var(--pass)';
    html += '<div class="flag-card flag-' + sev + '">' +
      '<div class="flag-title">' + icon + ' <span style="flex:1">' + esc(f.flag||'Risk') + '</span>' +
      '<span class="flag-sev" style="background:' + sevColor + '33;color:' + sevColor + '">' + sev + '</span></div>' +
      '<div class="flag-detail">' + esc(f.detail||'') + '</div></div>';
  });
  html += '</div>';
  el.innerHTML = html;
}

function emptyState(icon, msg) {
  return '<div class="empty" style="padding:50px 32px"><div class="empty-icon">' + icon + '</div><div>' + esc(msg) + '</div></div>';
}

// ── NOTES ─────────────────────────────────────────────────────
function renderNotesTab(uid) {
  document.getElementById('deal-body').innerHTML = '<div class="loading"><div class="spin"></div></div>';
  api('/api/notes/' + encodeURIComponent(uid)).then(function(data){
    buildNotesUI(data.notes||[], data.seenBy||{}, uid);
  }).catch(function(){
    buildNotesUI([], {}, uid);
  });
}

function buildNotesUI(notes, seenBy, uid) {
  let html = '';

  html += '<div class="seen-row">';
  html += '<span style="color:var(--muted)">👁 Seen by:</span>';
  if (seenBy.caleb) html += '<span><strong style="color:var(--buy)">Caleb</strong> <span style="color:var(--muted);font-size:10px">' + timeAgo(seenBy.caleb) + '</span></span>';
  if (seenBy.grant) html += '<span><strong style="color:var(--accent)">Grant</strong> <span style="color:var(--muted);font-size:10px">' + timeAgo(seenBy.grant) + '</span></span>';
  if (!seenBy.caleb && !seenBy.grant) html += '<span style="color:var(--muted)">Nobody yet</span>';
  html += '</div>';

  html += '<div style="padding:0 16px">';
  html += '<div class="author-switch">' +
    '<button class="auth-btn' + (AUTHOR==='caleb'?' active':'') + '" onclick="setAuthor(\'caleb\')">Caleb</button>' +
    '<button class="auth-btn' + (AUTHOR==='grant'?' active':'') + '" onclick="setAuthor(\'grant\')">Grant</button>' +
    '</div>';

  if (notes.length === 0) {
    html += '<div style="font-size:13px;color:var(--muted);padding:10px 0 18px;opacity:.7">No notes yet — add one below. Urban reads these in its next analysis.</div>';
  } else {
    notes.forEach(function(n){
      const isC = (n.author||'').toLowerCase()==='caleb';
      html += '<div class="note-bubble' + (isC?'':' grant-note') + '">' +
        '<div class="note-meta"><span class="note-author" style="color:' + (isC?'var(--buy)':'var(--accent)') + '">' + (isC?'CALEB':'GRANT') + '</span><span>' + timeAgo(n.created_at) + '</span></div>' +
        '<div class="note-text">' + esc(n.note) + '</div></div>';
    });
  }

  html += '<div class="note-input-wrap">' +
    '<textarea class="note-input" id="note-inp" placeholder="Add a note — Urban reads these…" data-uid="' + esc(uid) + '"></textarea>' +
    '<button class="note-btn" onclick="submitNote()">Add Note</button>' +
    '</div></div>';

  document.getElementById('deal-body').innerHTML = html;
}

function setAuthor(a) {
  AUTHOR = a;
  localStorage.setItem('urban_author', a);
  document.querySelectorAll('.auth-btn').forEach(function(b){b.classList.remove('active');});
  document.querySelector('.auth-btn.active');
  var idx = a === 'caleb' ? 0 : 1;
  var btns = document.querySelectorAll('.auth-btn');
  if (btns[idx]) btns[idx].classList.add('active');
}

function submitNote() {
  const inp = document.getElementById('note-inp');
  if (!inp) return;
  const note = inp.value.trim();
  const uid = inp.dataset.uid;
  if (!note || !uid) return;
  inp.value = '';
  inp.disabled = true;
  api('/api/notes/' + encodeURIComponent(uid), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({note:note, author:AUTHOR})
  }).then(function(data){
    buildNotesUI(data.notes||[], data.seenBy||{}, uid);
  }).catch(function(){
    inp.disabled = false;
    inp.value = note;
  });
}

// ── NEGOTIATION LADDER ────────────────────────────────────────
function renderLadder(uw) {
  if (!uw || !uw.arv || !uw.arv.urbanARV || !uw.rehab || !uw.rehab.urbanEstimate) {
    document.getElementById('deal-body').innerHTML =
      '<div class="empty"><div class="empty-icon">⏳</div><div>Run a full underwrite first to see the negotiation ladder</div></div>';
    return;
  }
  const arv   = uw.arv.urbanARV;
  const rehab = uw.rehab.urbanEstimate;
  const fi    = uw.financials || {};
  const holdCost = fi.holdingCosts && fi.holdingCosts.total || Math.round(arv*0.04);
  const sellCost = fi.sellingCosts && fi.sellingCosts.total || Math.round(arv*0.075);
  const hmlCost  = (fi.hardMoney && ((fi.hardMoney.totalInterest||0)+(fi.hardMoney.originationPoints||0))) || Math.round(arv*0.035);
  const totalCosts = rehab + holdCost + sellCost + hmlCost;
  const mao   = Math.round(arv*0.70 - rehab);
  const open_ = Math.round(mao*0.88);
  const nudge = Math.round(mao*0.91);
  const hold  = Math.round(mao*0.94);
  const profitAt = function(p){ return Math.round(arv - p - totalCosts); };
  const _fiAsk = fi.askingPrice && parseFloat(fi.askingPrice) > 1000 ? parseFloat(fi.askingPrice) : 0;
  const _rawAsk = curDeal ? (parseFloat(curDeal.askingPrice)||0) : 0;
  const ask = _fiAsk || (_rawAsk >= 1000 ? _rawAsk : 0);

  let html = '';

  if (ask > 0) {
    const gap = ask - open_;
    const pct2 = mao > 0 ? Math.round(((ask/mao)-1)*100) : 0;
    let gapLabel, gapColor, barW;
    if (ask <= mao)        { gapLabel='Under MAO ✅'; gapColor='var(--buy)'; barW='20%'; }
    else if (pct2 <= 10)   { gapLabel=fmtK(gap)+' spread — Closeable'; gapColor='var(--accent)'; barW='40%'; }
    else if (pct2 <= 20)   { gapLabel=fmtK(gap)+' spread — Tight'; gapColor='var(--review)'; barW='65%'; }
    else                   { gapLabel=fmtK(gap)+' spread — Far apart'; gapColor='var(--hot)'; barW='90%'; }
    html += '<div class="gap-row"><div class="gap-top">' +
        '<span style="color:var(--muted)">Ask <strong style="color:var(--text)">' + fmtK(ask) + '</strong></span>' +
        '<span class="gap-pill" style="background:' + gapColor + '22;color:' + gapColor + '">' + gapLabel + '</span>' +
        '<span style="color:var(--muted)">MAO <strong style="color:var(--text)">' + fmtK(mao) + '</strong></span>' +
      '</div><div class="gap-bar-wrap"><div class="gap-bar" style="width:' + barW + ';background:' + gapColor + '"></div></div></div>';
  }

  const tiers = [
    {label:'Open',  price:open_,  profit:profitAt(open_),  color:'var(--buy)'},
    {label:'Nudge', price:nudge,  profit:profitAt(nudge),  color:'var(--accent)'},
    {label:'Hold',  price:hold,   profit:profitAt(hold),   color:'var(--review)'},
    {label:'Walk',  price:mao,    profit:profitAt(mao),    color:'var(--hot)'},
  ];
  tiers.forEach(function(t){
    const pColor = t.profit >= 0 ? 'var(--buy)' : 'var(--hot)';
    html += '<div class="tier-row" style="border-left-color:' + t.color + '">' +
      '<div class="tier-label" style="color:' + t.color + '">' + t.label + '</div>' +
      '<div class="tier-price" style="color:' + t.color + '">' + fmtM(t.price) + '</div>' +
      '<div class="tier-profit" style="color:' + pColor + '">' + (t.profit>0?'+':'') + fmtK(t.profit) + '</div>' +
    '</div>';
  });

  html += '<div class="counter-row"><div class="counter-lbl">They counter at</div>' +
    '<div class="counter-input-line"><span style="color:var(--muted)">$</span>' +
    '<input class="counter-inp" type="number" placeholder="Enter their number" oninput="evalCounterM(this.value,' + mao + ',' + nudge + ',' + hold + ',' + open_ + ')" id="m-counter-inp"></div>' +
    '<div class="counter-result" id="m-counter-res">—</div></div>';

  html += '<div class="script-tabs" id="m-script-tabs">' +
    '<button class="stab" data-s="open" onclick="setScriptTabM(\'open\')">Open</button>' +
    '<button class="stab" data-s="nudge" onclick="setScriptTabM(\'nudge\')">Nudge</button>' +
    '<button class="stab" data-s="hold" onclick="setScriptTabM(\'hold\')">Hold</button>' +
    '<button class="stab" data-s="walk" onclick="setScriptTabM(\'walk\')">Walk</button></div>';
  html += '<div class="script-box" id="m-script-box"></div>';

  document.getElementById('deal-body').innerHTML = html;

  window._mLadder = { open_, nudge, hold, mao, arv };
  setScriptTabM('open');
}

function evalCounterM(val, mao, nudge, hold, open_) {
  const num = parseFloat(val) || 0;
  const res = document.getElementById('m-counter-res');
  if (!res || num <= 0) { if(res) {res.innerHTML='—'; res.style.color='var(--muted)';} return; }
  if (num <= nudge)      { res.innerHTML='✅ Accept'; res.style.color='var(--buy)'; }
  else if (num <= hold)  { res.innerHTML='Counter at ' + fmtK(nudge); res.style.color='var(--accent)'; }
  else if (num <= mao)   { res.innerHTML='Hold at ' + fmtK(hold); res.style.color='var(--review)'; }
  else                   { res.innerHTML='🚶 Walk away'; res.style.color='var(--hot)'; }
}

function setScriptTabM(tab) {
  document.querySelectorAll('#m-script-tabs .stab').forEach(function(b){
    const on = b.dataset.s === tab;
    b.style.background = on ? 'rgba(200,169,110,.15)' : 'transparent';
    b.style.borderColor = on ? 'var(--accent)' : 'var(--border2)';
    b.style.color = on ? 'var(--accent)' : 'var(--muted)';
  });
  const L = window._mLadder || {};
  const fN = function(n){ return '$' + Math.round(n).toLocaleString(); };
  const wsName = curDeal && (curDeal.contact1Name || curDeal.wholesalerCompany || '') || '';
  const fn = wsName.split(' ')[0] || 'them';
  const scripts = {
    open: ['OPENING OFFER', '"Hey ' + fn + ' — we ran the numbers. We can do ' + fN(L.open_) + '. Based on our comps, ARV is around ' + fN(L.arv) + ' and we have a real rehab scope here. That\'s where the math puts us."'],
    nudge: ['IF THEY PUSH BACK', '"I hear you. We can stretch to ' + fN(L.nudge) + '. That\'s us moving significantly off our opening — tight for us, but if you can get there, we sign today."'],
    hold: ['STANDING FIRM', '"' + fn + ', I\'ve pushed this as far as I can go. ' + fN(L.hold) + ' is the number. The comps don\'t support going higher. At this price we make it work."'],
    walk: ['WALKING AWAY', '"' + fn + ' — doesn\'t work for us at that number. No hard feelings. Keep us in mind next time something comes through."'],
  };
  const s = scripts[tab] || scripts.open;
  document.getElementById('m-script-box').innerHTML = '<span class="script-eyebrow">' + s[0] + '</span>' + esc(s[1]);
}

// ── CHAT ──────────────────────────────────────────────────────
function renderChat() {
  let html = '<div style="display:flex;flex-direction:column;min-height:100%">' +
    '<div style="flex:1">' +
    '<div class="chat-messages" id="chat-list">';

  if (chatHistory.length === 0) {
    html += '<div class="chat-bubble urban">Ask me anything about this deal — comps, numbers, rehab scope, what-ifs.</div>';
    html += '</div>';
    html += '<div style="display:flex;flex-wrap:wrap;gap:7px;padding:12px 16px 0">' +
      ['What if repairs are $45K?','Give me 3 better comps','Counter-offer script?'].map(function(q){
        return '<span class="suggested-chip" onclick="useChip(this)">' + esc(q) + '</span>';
      }).join('') + '</div>';
  } else {
    chatHistory.forEach(function(m){
      html += '<div class="chat-bubble ' + m.role + (m.thinking?' thinking':'') + '">' + esc(m.text) + '</div>';
    });
    html += '</div>';
  }
  html += '</div>';
  html += '<div class="chat-input-wrap">' +
    '<input class="chat-input" id="chat-inp" type="text" placeholder="Message Urban…">' +
    '<button class="chat-send" onclick="sendChat()">↑</button>' +
  '</div></div>';

  document.getElementById('deal-body').innerHTML = html;
  document.getElementById('chat-inp').addEventListener('keydown', function(e){
    if (e.key === 'Enter') sendChat();
  });
}

function useChip(el) {
  document.getElementById('chat-inp').value = el.textContent;
  sendChat();
}

function sendChat() {
  const inp = document.getElementById('chat-inp');
  if (!inp) return;
  const msg = inp.value.trim();
  if (!msg || !curDeal) return;
  inp.value = '';
  const uid = curDeal.uid || (curDeal.address + '-' + curDeal.dateReceived);

  chatHistory.push({role:'user', text:msg});
  chatHistory.push({role:'urban thinking', text:'Thinking…', thinking:true});
  refreshChatUI();

  api('/api/chat/' + encodeURIComponent(uid), {
    method:'POST', headers:{'Content-Type':'application/json'},
    body: JSON.stringify({message:msg, author:AUTHOR, address:curDeal.address, city:curDeal.city})
  }).then(function(data){
    chatHistory.pop();
    chatHistory.push({role:'urban', text: data.reply || data.message || JSON.stringify(data)});
    refreshChatUI();
  }).catch(function(e){
    chatHistory.pop();
    chatHistory.push({role:'urban', text:'Error: ' + e.message});
    refreshChatUI();
  });
}

function refreshChatUI() {
  const list = document.getElementById('chat-list');
  if (!list) return;
  list.innerHTML = chatHistory.map(function(m){
    return '<div class="chat-bubble ' + m.role + (m.thinking?' thinking':'') + '">' + esc(m.text) + '</div>';
  }).join('');
  list.scrollTop = list.scrollHeight;
  const chips = document.querySelector('.suggested-chip');
  if (chips) chips.closest('div').remove();
}
</script>
