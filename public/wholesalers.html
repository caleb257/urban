<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Wholesalers — CCG</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0d0d0d;color:#e8e2d6;font-family:-apple-system,BlinkMacSystemFont,sans-serif;min-height:100vh}
header{background:#111;border-bottom:1px solid #222;padding:14px 20px;display:flex;align-items:center;gap:16px}
header a{color:#7a7060;text-decoration:none;font-size:13px;white-space:nowrap}
header h1{font-size:17px;font-weight:700;letter-spacing:2px;color:#c8aa60}
.search{background:#111;border-bottom:1px solid #1a1a1a;padding:10px 16px}
.search input{width:100%;background:#1a1a1a;border:1px solid #2a2a2a;color:#e8e2d6;border-radius:8px;padding:9px 14px;font-size:14px;outline:none}
.search input:focus{border-color:#c8aa60}
.company{border-bottom:1px solid #161616}
.co-hdr{padding:13px 16px;cursor:pointer;display:flex;align-items:center;gap:12px}
.co-hdr:hover{background:#111}
.co-name{font-weight:700;font-size:14px;flex:1}
.co-meta{display:flex;gap:8px;align-items:center;margin-top:2px;flex-wrap:wrap}
.badge{font-size:11px;padding:2px 7px;border-radius:4px;background:#1a1a1a;color:#666}
.badge.warn{background:rgba(245,166,35,.1);color:#f5a623}
.co-count{font-size:18px;font-weight:700;color:#c8aa60;min-width:32px;text-align:right}
.chevron{color:#333;font-size:16px;transition:transform .2s;flex-shrink:0}
.open .chevron{transform:rotate(90deg)}
.agents{display:none;padding-bottom:6px}
.open+.agents{display:block}
.agent{padding:12px 16px 12px 32px;border-top:1px solid #131313;display:flex;gap:10px;align-items:flex-start}
.av{width:34px;height:34px;border-radius:50%;background:#1e1a12;border:1px solid #2a2408;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px;color:#c8aa60;flex-shrink:0}
.ai{flex:1;min-width:0}
.an{font-weight:600;font-size:13px}
.ac{display:flex;flex-wrap:wrap;gap:8px;margin-top:3px}
.ac a{color:#6496c8;font-size:12px;text-decoration:none}
.ac a:hover{text-decoration:underline}
.avs{display:flex;gap:6px;margin-top:5px;flex-wrap:wrap}
.vp{font-size:11px;padding:2px 6px;border-radius:4px}
.vb{background:rgba(100,200,130,.12);color:#64c882}
.vr{background:rgba(245,200,80,.08);color:#f5c842}
.vp2{background:rgba(120,110,90,.12);color:#7a7060}
.vh{background:rgba(200,60,60,.1);color:#cc4466}
.vc{background:rgba(100,150,200,.1);color:#6496c8}
.sc{font-size:12px;margin-top:4px}
.sc.g{color:#64c882}.sc.y{color:#f5c842}.sc.r{color:#cc4466}
.aw{font-size:11px;color:#f5a623;margin-top:3px}
.dc{font-size:16px;font-weight:700;color:#c8aa60;flex-shrink:0}
.empty{padding:60px 16px;text-align:center;color:#444;font-size:14px}
</style>
</head>
<body>
<header>
  <a id="back-link">&larr; Back to Urban</a>
  <h1>WHOLESALERS</h1>
</header>
<div class="search"><input id="q" type="text" placeholder="Search company, agent, email, phone..." oninput="filter()"></div>
<div id="list"></div>
<script>
var TOKEN = (location.search.match(/[?&]token=([^&]*)/) || [])[1] || '';
document.getElementById('back-link').href = '/?token=' + TOKEN;
var data = [];

function vclass(v) {
  if (v === 'BUY' || v === 'HOT') return 'vb';
  if (v === 'REVIEW') return 'vr';
  if (v === 'PASS') return 'vp2';
  if (v === 'HARD NO') return 'vh';
  return 'vc';
}
function vlabel(v) {
  if (v === 'HARD NO') return 'HARD NO';
  if (v === 'NEED COMPS') return 'COMPS';
  return v;
}

function agentHtml(a) {
  var init = (a.name || '?').split(' ').map(function(w){ return w[0]||''; }).join('').slice(0,2).toUpperCase();
  var total = Object.values(a.verdicts || {}).reduce(function(s,n){ return s+n; }, 0);
  var action = ['BUY','HOT','REVIEW'].reduce(function(s,v){ return s + (a.verdicts[v]||0); }, 0);
  var pct = total > 0 ? Math.round(action/total*100) : 0;
  var sc = pct >= 30 ? 'g' : pct >= 10 ? 'y' : 'r';
  var vhtml = Object.keys(a.verdicts||{}).map(function(v){ return '<span class="vp ' + vclass(v) + '">' + (a.verdicts[v]||0) + ' ' + vlabel(v) + '</span>'; }).join('');
  var phones = [a.phone, a.phone2].filter(Boolean).map(function(p){ return '<a href="tel:' + p + '">' + p + '</a>'; }).join('');
  var email = a.email ? '<a href="mailto:' + a.email + '">' + a.email + '</a>' : '';
  var arv = (a.arv && parseFloat(a.arv) > 10) ? '<div class="aw">&#9888;&#65039; ARV inflated avg ' + parseFloat(a.arv).toFixed(1) + '%</div>' : '';
  return '<div class="agent"><div class="av">' + init + '</div><div class="ai"><div class="an">' + (a.name||'') + '</div><div class="ac">' + email + phones + '</div><div class="avs">' + vhtml + '</div><div class="sc ' + sc + '">' + pct + '% actionable &middot; ' + total + ' deal' + (total!==1?'s':'') + '</div>' + arv + '</div><div class="dc">' + total + '</div></div>';
}

function coHtml(co) {
  var warn = co.agents.some(function(a){ return a.warn; });
  var wb = warn ? '<span class="badge warn">&#9888;&#65039; ARV Inflation</span>' : '';
  var id = 'co' + co.company.replace(/[^a-z0-9]/gi,'_');
  return '<div class="company"><div class="co-hdr" onclick="toggle(this)" id="' + id + '"><div><div class="co-name">' + co.company + '</div><div class="co-meta"><span class="badge">' + co.agents.length + ' agent' + (co.agents.length!==1?'s':'') + '</span><span class="badge">' + co.totalDeals + ' deals</span>' + wb + '</div></div><div style="display:flex;align-items:center;gap:8px"><div class="co-count">' + co.totalDeals + '</div><div class="chevron">&#8250;</div></div></div><div class="agents">' + co.agents.map(agentHtml).join('') + '</div></div>';
}

function render(d) {
  var el = document.getElementById('list');
  el.innerHTML = d.length ? d.map(coHtml).join('') : '<div class="empty">No wholesalers found.</div>';
}

function toggle(el) { el.classList.toggle('open'); }

function filter() {
  var q = document.getElementById('q').value.toLowerCase().trim();
  if (!q) { render(data); return; }
  var r = [];
  data.forEach(function(co) {
    if (co.company.toLowerCase().includes(q)) { r.push(co); return; }
    var ma = co.agents.filter(function(a){ return (a.name||'').toLowerCase().includes(q)||(a.email||'').toLowerCase().includes(q)||(a.phone||'').includes(q)||(a.phone2||'').includes(q); });
    if (ma.length) r.push({ company: co.company, totalDeals: co.totalDeals, agents: ma });
  });
  render(r);
}

fetch('/api/wholesalers', { headers: { 'x-urban-token': TOKEN } })
  .then(function(r){ return r.json(); })
  .then(function(d){ data = d; render(d); })
  .catch(function(){ document.getElementById('list').innerHTML = '<div class="empty">Could not load — invalid token.</div>'; });
</script>
</body>
</html>
